                    // propósito (x/y = -9999), o que sem essa checagem disparava o som de
                    // queda repetidamente a cada frame.
                    if (!p.eliminated && (p.x < -VOID_MARGIN || p.x > WORLD_WIDTH + VOID_MARGIN || p.y > WORLD_HEIGHT + VOID_MARGIN)) {
                        SFX.playFall();
                        respawnPlayer(p);
                    }

                    // Processa o golpe atual: ativa a hitbox na janela certa e verifica acerto nos oponentes
                    updateAttack(p, now);
                } else {
                    isMoving = p.isMoving || false;
                    // Interpolação suave em direção à última posição recebida pela rede,
                    // evita o efeito "travadinho" de só atualizar 10x/segundo
                    if (Number.isFinite(p.renderTargetX) && Number.isFinite(p.renderTargetY)) {
                        if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) {
                            // Posição corrompida (NaN): pula direto pro alvo em vez de interpolar do nada
                            p.x = p.renderTargetX;
                            p.y = p.renderTargetY;
                        } else {
                            const lerpFactor = Math.min(1, effectiveDelta * 20);
                            p.x += (p.renderTargetX - p.x) * lerpFactor;
                            p.y += (p.renderTargetY - p.y) * lerpFactor;
                        }
                    }
                }

                drawList.push({ kind: 'player', y: p.y, player: p, isMoving });

                // Rastro de movimento: só aparece durante o voo rápido de um golpe forte
                maybeSpawnMotionTrail(p, now);
            }
            }

            drawList.sort((a, b) => a.y - b.y);

            // Rastro de movimento desenhado ANTES dos personagens (fica atrás deles)
            updateAndDrawMotionTrails(deltaTime * 1000);
            updateAndDrawFallingBuckets(deltaTime * 1000);
            updateNailPolishBottles(deltaTime * 1000);
            drawNailPolishBottles();
            updateNailClippers(deltaTime * 1000);
            drawNailClippers();
            updateBullets(deltaTime * 1000);
            drawBullets();
            updateJellyBalls(deltaTime * 1000);
            drawJellyBalls();

            for (const item of drawList) {
                drawPlayer(item.player, item.isMoving);
            }

            // Faíscas de impacto, linhas de impacto e números de dano flutuantes,
            // desenhados por cima dos personagens e dentro do mesmo shake/zoom de câmera
            updateAndDrawParticles(deltaTime * 1000);
            drawClawEffects();
            updateAndDrawPolishSplashes(deltaTime * 1000);
            updateAndDrawImpactLines(deltaTime * 1000);
            updateAndDrawDamagePopups(deltaTime * 1000);

            // Linhas de velocidade radiais (voo de golpe forte), dentro da câmera transformada
            drawSpeedLines();

            ctx.restore(); // fecha o save() do zoom de câmera

            // HUD de dano (%) de todos os jogadores: fixo embaixo da tela, lado a lado, como no Smash Bros
            const hudIds = Object.keys(players);
            if (hudIds.length > 0) {
                const slotWidth = 140;
                const totalWidth = hudIds.length * slotWidth;
                const startX = canvas.width / 2 - totalWidth / 2;
                ctx.save();
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                hudIds.forEach((pid, i) => {
                    const p = players[pid];
                    const damagePct = Math.round(p.damage || 0);
                    const damageColor = damagePct < 50 ? '#2e7d32' : damagePct < 100 ? '#e6a400' : '#d32f2f';
                    const slotCenterX = startX + slotWidth * i + slotWidth / 2;

                    // Retrato do personagem: pequeno ícone circular à esquerda do nome/dano
                    const charDef = CHARACTERS[p.character] || CHARACTERS.renanzinho;
                    const portraitImg = charDef.sprites && charDef.sprites.idle;
                    const portraitR = 16;
                    const portraitX = slotCenterX - slotWidth / 2 + 22;
                    const portraitY = canvas.height - 42;
                    if (portraitImg && portraitImg.complete && portraitImg.naturalWidth > 0) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(portraitX, portraitY, portraitR, 0, Math.PI * 2);
                        ctx.closePath();
                        ctx.strokeStyle = p.eliminated ? '#888888' : (damageColor);
                        ctx.lineWidth = 2;
                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                        ctx.fill();
                        ctx.stroke();
                        ctx.clip();
                        if (p.eliminated) ctx.globalAlpha = 0.4;
                        ctx.drawImage(portraitImg, portraitX - portraitR, portraitY - portraitR, portraitR * 2, portraitR * 2);
                        ctx.restore();
                    }

                    ctx.fillStyle = p.eliminated ? '#888888' : '#000000';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(p.name, slotCenterX, canvas.height - 62);
                    if (p.eliminated) {
                        ctx.fillStyle = '#888888';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.fillText('ELIMINADO', slotCenterX, canvas.height - 25);
                    } else {
                        ctx.fillStyle = damageColor;
                        ctx.font = 'bold 24px sans-serif';
                        ctx.fillText(damagePct + '%', slotCenterX, canvas.height - 25);
                        // Vidas: bolinhas preenchidas (estilo Smash Bros)
                        const lives = typeof p.lives === 'number' ? p.lives : 3;
                        const dotRadius = 5;
                        const dotGap = 14;
                        const dotsStartX = slotCenterX - ((lives - 1) * dotGap) / 2;
                        for (let d = 0; d < lives; d++) {
                            ctx.beginPath();
                            ctx.fillStyle = '#ffffff';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1.5;
                            ctx.arc(dotsStartX + d * dotGap, canvas.height - 38, dotRadius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
                });
                ctx.restore();
            }

            // Raio vermelho/preto de KO: desenhado FORA da transformação de câmera
            // (cobre a tela inteira de forma consistente, sem ser afetado pelo zoom/shake)
            drawKOFlash();

            // Tela de fim de partida agora é a cena 2.5D (#victory-overlay), controlada
            // via triggerVictoryScreen()/checkMatchEnd() em vez de desenhada no canvas.

            requestAnimationFrame(gameLoop);
        }

        // Jogador caiu fora da plataforma (void): perde uma vida. Com vidas restantes, "morre"
        // e reaparece no centro do palco zerando o dano (como antes). Sem vidas restantes, é
        // eliminado definitivamente da partida (estilo Super Smash Bros).
        function respawnPlayer(p) {
            if (matchOver) return;

            p.lives = (typeof p.lives === 'number' ? p.lives : 3) - 1;

            if (p.lives <= 0) {
                p.eliminated = true;
                p.damage = 0;
                // Tira o jogador eliminado de cena (fora da área jogável, sem física)
                p.x = -9999;
                p.y = -9999;
                p.vy = 0;
                p.knockbackVx = 0;
                MP.sendState();
                checkMatchEnd();
                return;
            }

            const stage = getStageRect();
            p.x = stage.x + stage.width / 2;
            p.y = stage.y - PLAYER_SIZE / 2;
            p.vy = 0;
            p.knockbackVx = 0;
            p.onGround = true;
            p.isJumping = false;
            p.doubleJumpUsed = false;
            p.isDoubleJumping = false;
            p.attackName = null;
            p.attackUntil = 0;
            p.queuedAttack = null;
            p.hitstunUntil = 0;
            p.damage = 0;
            MP.sendState();
        }

        // Verifica se sobrou apenas 1 jogador (ou 0) não-eliminado: se sim, ele é o campeão
        // da partida e o jogo é travado até dar reset.
        function checkMatchEnd() {
            const allIds = Object.keys(players);
            if (allIds.length === 0) return;
            const alive = allIds.filter(id => !players[id].eliminated);
            if (alive.length <= 1 && !matchOver) {
                matchOver = true;
                championId = alive.length === 1 ? alive[0] : null;
                triggerVictoryScreen();
            }
        }

        // Reinicia a partida: todo mundo volta com 3 vidas, dano zerado e sem eliminação
        function restartMatch() {
            matchOver = false;
            championId = null;
            for (const id of Object.keys(players)) {
                const p = players[id];
                p.lives = 3;
                p.eliminated = false;
                p.damage = 0;
            }
            if (players[myUserId]) {
                const stage = getStageRect();
                players[myUserId].x = stage.x + stage.width / 2;
                players[myUserId].y = stage.y - PLAYER_SIZE / 2;
                players[myUserId].vy = 0;
            }
            MP.sendState();
        }

        // "Jogar de novo": espera todos os jogadores confirmarem antes de voltar para a
        // tela de seleção de personagens (ao invés de reiniciar a partida direto no mapa).
        let _playAgainState = {}; // pid -> true quando confirmou
        function requestPlayAgain() {
            if (_playAgainState[myUserId]) return;
            _playAgainState[myUserId] = true;
            MP.broadcastToAll({ type: 'playAgain', pid: myUserId });
            updateVictoryStatusPanel();
            checkPlayAgainAll();
        }

        function checkPlayAgainAll() {
            const allIds = Object.keys(players);
            if (allIds.length === 0) return;
            const allConfirmed = allIds.every(id => _playAgainState[id]);
            if (allConfirmed) {
                _playAgainState = {};
                matchOver = false;
                championId = null;
                isRunning = false;
                hideVictoryScreen();
                restartMatch();
                openReadyScreen();
            }
        }

        // ==========================================
        // TELA DE VITÓRIA 2.5D (estilo Smash Bros)
        // ==========================================
        // Cena HTML/CSS falso-3D por cima do jogo: a câmera orbita o campeão (usando o
        // sprite REAL do personagem escolhido por ele) e depois se aproxima bruscamente
        // num ângulo dramático, com flash + texto "VITÓRIA!". Só depois disso os
        // jogadores derrotados aparecem no painel inferior, cada um com sua própria
        // sprite/skin real e em quantidade igual ao nº de perdedores da partida.

        const victoryOverlay = document.getElementById('victory-overlay');
        const victoryWorld = document.getElementById('victory-world');
        const victoryChampionEl = document.getElementById('victory-champion');
        const victoryChampionImg = document.getElementById('victory-champion-img');
        const victoryChampionName = document.getElementById('victory-champion-name');
        const victoryFlashEl = document.getElementById('victory-flash');
        const victoryTextEl = document.getElementById('victory-text');
        const loserPanelEl = document.getElementById('loser-panel');
        const victoryStatusPanelEl = document.getElementById('victory-status-panel');

        let vRotX = -15, vRotY = 45, vCamZ = 0;
        let vAnimFrameId = null;

        function easeInExpoV(t) { return t === 0 ? 0 : Math.pow(2, 10 * (t - 1)); }
        function easeInOutSineV(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

        function updateVictoryCamera() {
            victoryWorld.style.transform = `translateZ(${vCamZ}px) rotateX(${vRotX}deg) rotateY(${vRotY}deg)`;

            const DEG2RAD = Math.PI / 180;
            const radX = vRotX * DEG2RAD, radY = vRotY * DEG2RAD;
            const cosY = Math.cos(radY), sinY = Math.sin(radY);
            const cosX = Math.cos(radX), sinX = Math.sin(radX);

            document.querySelectorAll('#victory-world .v-billboard').forEach(b => {
                const x = parseFloat(b.dataset.x) || 0;
                const y = parseFloat(b.dataset.y) || 0;
                const z = parseFloat(b.dataset.z) || 0;
                const height = b.offsetHeight;
                const anchor = 'translate(-50%, -50%)';
                const offsetY = b.dataset.anchor === 'bottom' ? -(height / 2) : 0;
                b.style.transform = `translate3d(${x}px, ${y + offsetY}px, ${z}px) rotateY(${-vRotY}deg) rotateX(${-vRotX}deg) ${anchor}`;
            });
        }

        // Dispara a cena de vitória inteira: monta o campeão com seu sprite real e
        // roda a animação de câmera (órbita -> zoom dramático -> flash/texto).
        function triggerVictoryScreen() {
            if (vAnimFrameId) return; // já animando

            const champ = championId && players[championId] ? players[championId] : null;
            const charDef = CHARACTERS[(champ && champ.character) || 'renanzinho'] || CHARACTERS.renanzinho;
            victoryChampionImg.src = (charDef.sprites.idle && charDef.sprites.idle.src) || '';
            victoryChampionName.textContent = champ ? champ.name : '???';

            victoryOverlay.style.display = 'block';
            loserPanelEl.classList.remove('visible');
            loserPanelEl.innerHTML = '';
            victoryStatusPanelEl.classList.remove('visible');
            victoryFlashEl.style.opacity = '0';
            victoryTextEl.style.opacity = '0';
            victoryTextEl.style.transform = 'translate(-50%, -20px)';

            vRotX = -15; vRotY = 45; vCamZ = 0;
            updateVictoryCamera();

            const orbitStartRotY = vRotY;
            const orbitRotX = -22;
            const orbitLaps = 1.35;
            const orbitDurationMs = 3200;
            const orbitFarZ = -650;

            const zoomDurationMs = 850;
            const zoomEndRotX = -10;
            const zoomEndZ = 260;

            const t0 = performance.now();

            function orbitStep(now) {
                const elapsed = now - t0;
                const t = Math.min(1, elapsed / orbitDurationMs);
                const eased = easeInOutSineV(t);

                vRotY = orbitStartRotY + eased * (orbitLaps * 360);
                vRotX = vRotX + (orbitRotX - vRotX) * Math.min(1, elapsed / (orbitDurationMs * 0.3));
                vCamZ = vCamZ + (orbitFarZ - vCamZ) * Math.min(1, elapsed / (orbitDurationMs * 0.3));

                updateVictoryCamera();

                if (t < 1) {
                    vAnimFrameId = requestAnimationFrame(orbitStep);
                } else {
                    const zoomStartRotX = vRotX, zoomStartZ = vCamZ, zoomStartRotY = vRotY;
                    const t1 = performance.now();

                    function zoomStep(now2) {
                        const elapsed2 = now2 - t1;
                        const tz = Math.min(1, elapsed2 / zoomDurationMs);
                        const easedZoom = easeInExpoV(tz);

                        vCamZ = zoomStartZ + (zoomEndZ - zoomStartZ) * easedZoom;
                        vRotX = zoomStartRotX + (zoomEndRotX - zoomStartRotX) * easedZoom;
                        vRotY = zoomStartRotY + easedZoom * 10;

                        updateVictoryCamera();

                        if (tz > 0.7) {
                            const flashT = (tz - 0.7) / 0.3;
                            victoryFlashEl.style.opacity = flashT;
                            victoryTextEl.style.opacity = flashT;
                            victoryTextEl.style.transform = `translate(-50%, ${-20 + (1 - flashT) * 20}px)`;
                        }

                        if (tz < 1) {
                            vAnimFrameId = requestAnimationFrame(zoomStep);
                        } else {
                            vAnimFrameId = null;
                            // Animação de vitória concluída: só agora entram os perdedores + status
                            showLoserPanel();
                            updateVictoryStatusPanel();
                            victoryStatusPanelEl.classList.add('visible');
                        }
                    }
                    vAnimFrameId = requestAnimationFrame(zoomStep);
                }
            }
            vAnimFrameId = requestAnimationFrame(orbitStep);
        }

        // Monta o painel inferior com um quadrado por jogador PERDEDOR (todos menos o
        // campeão), usando o sprite real do personagem de cada um. A quantidade se
        // ajusta sozinha ao número de jogadores da partida (2 jogadores -> 1 quadrado,
        // 4 jogadores -> 3 quadrados, etc.).
        function showLoserPanel() {
            const allIds = Object.keys(players);
            const losers = allIds.filter(id => id !== championId);

            loserPanelEl.innerHTML = '';
            losers.forEach(id => {
                const p = players[id];
                if (!p) return;
                const charDef = CHARACTERS[p.character] || CHARACTERS.renanzinho;
                const spriteSrc = (charDef.sprites.idle && charDef.sprites.idle.src) || '';

                const sq = document.createElement('div');
                sq.className = 'loser-square';

                const img = document.createElement('img');
                img.src = spriteSrc;
                img.alt = p.name || '';
                sq.appendChild(img);

                const nameEl = document.createElement('div');
                nameEl.className = 'loser-name';
                nameEl.textContent = p.name || '';
                sq.appendChild(nameEl);

                loserPanelEl.appendChild(sq);
            });

            // Fade-in só depois de montar o conteúdo
            requestAnimationFrame(() => loserPanelEl.classList.add('visible'));
        }

        function updateVictoryStatusPanel() {
            const allIds = Object.keys(players);
            if (allIds.length === 0) return;
            const confirmedCount = allIds.filter(id => _playAgainState[id]).length;
            victoryStatusPanelEl.textContent = _playAgainState[myUserId]
                ? `Aguardando outros jogadores... (${confirmedCount}/${allIds.length})`
                : 'Pressione R para jogar novamente';
        }

        function hideVictoryScreen() {
            if (vAnimFrameId) {
                cancelAnimationFrame(vAnimFrameId);
                vAnimFrameId = null;
            }
            victoryOverlay.style.display = 'none';
            loserPanelEl.classList.remove('visible');
            loserPanelEl.innerHTML = '';
            victoryStatusPanelEl.classList.remove('visible');
        }

        // Inicia um golpe para o jogador local (soco com combo em 2 hits, ou chute avulso)
        // Ataque exclusivo da Aggie: arremessa um frasco de esmalte no chão à sua frente,
        // que explode depois de alguns segundos causando dano em área.
        function throwPolish(p) {
            if (!p || p.character !== 'aggie') return;
            if (p.hitstunUntil && Date.now() < p.hitstunUntil) return;
            if (p.attackUntil && Date.now() < p.attackUntil) return;
            if (p.attackCooldownUntil && Date.now() < p.attackCooldownUntil) return;

            const now = Date.now();
            const def = CHARACTERS.aggie.attacks.throwPolish;
            p.attackName = 'throwPolish';
            p.attackStart = now;
            p.attackUntil = now + def.duration;
            p.attackCooldownUntil = now + def.duration + ATTACK_COOLDOWN;
            p.attackSquashTime = now;

            const dir = p.facingLeft ? -1 : 1;
            const color = POLISH_COLORS[Math.floor(Math.random() * POLISH_COLORS.length)];
            const bottle = {
                id: 'polish_' + now + '_' + Math.floor(Math.random() * 100000),
                x: p.x + dir * 20,
                y: p.y - 40,
                vx: dir * 340,
                vy: -120,
                color,
                onGround: false,
                landTime: 0,
                exploded: false,
                ownerId: myUserId
            };
            nailPolishBottles.push(bottle);
            SFX.playSwing(1);
            MP.sendState();
            MP.broadcastToAll({ type: 'polishThrow', bottle });
        }

        // Arremessa o alicate (boomerang): vai em linha reta, volta ao alcançar a distância
        // máxima, e some depois de um tempo. Não bloqueia p.attackName/attackUntil (usa seu
        // próprio cooldown, em p.clipperCooldownUntil), então dá pra usar outros ataques
        // enquanto ele ainda está voando — só o disparo de outro alicate fica bloqueado.
        // Atira uma bala reta e rápida, curto alcance/vida (pressão constante, não zoning).
        // Igual ao throwClipper, não bloqueia p.attackName/attackUntil — usa cooldown próprio
        // em p.bulletCooldownUntil, então dá pra socar/atirar sem travar um no outro.
        function shootBullet(p) {
            if (!p || p.character !== 'renanAntigo') return;
            if (p.hitstunUntil && Date.now() < p.hitstunUntil) return;
            if (p.bulletCooldownUntil && Date.now() < p.bulletCooldownUntil) return;

            const now = Date.now();
            p.bulletCooldownUntil = now + BULLET_COOLDOWN;
            p.bulletShootFlashUntil = now + CHARACTERS.renanAntigo.attacks.shootBullet.duration; // só pro sprite de tiro piscar rápido
            p.attackSquashTime = now;

            const dir = p.facingLeft ? -1 : 1;
            const bullet = {
                id: 'bullet_' + now + '_' + Math.floor(Math.random() * 100000),
                x: p.x + dir * 20,
                y: p.y - PLAYER_SIZE * 0.5,
                dir,
                hitIds: [],
                spawnTime: now,
                ownerId: myUserId
            };
            bullets.push(bullet);
            SFX.playSwing(1.4);
            MP.sendState();
            MP.broadcastToAll({ type: 'bulletShoot', bullet });
        }

        // Ativa o escudo temporário (seta pra baixo + Z): usa attackName/attackUntil (como qualquer
        // outro golpe) para reaproveitar o bloqueio de movimento já existente enquanto ataca — assim
        // o Renan Antigo fica parado, sem precisar de nenhuma lógica nova de "não pode se mover".
        // Enquanto isShielding estiver true, applyHit ignora qualquer dano recebido, e a checagem de
        // contato (checkShieldContact) pune quem chegar perto demais dele.
        function activateShield(p) {
            if (!p || p.character !== 'renanAntigo') return;
            const now = Date.now();
            if (p.hitstunUntil && now < p.hitstunUntil) return;
            if (p.attackUntil && now < p.attackUntil) return; // já atacando/já escudado
            if (p.shieldCooldownUntil && now < p.shieldCooldownUntil) return;

            const def = CHARACTERS.renanAntigo.attacks.shield;
            p.attackName = 'shield';
            p.attackStart = now;
            p.attackUntil = now + def.duration;
            p.isShielding = true;
            p.shieldHitIds = []; // evita punir o mesmo oponente várias vezes por frame
            p.attackSquashTime = now; // squash & stretch no instante de ativar, igual aos outros golpes
            SFX.playSwing(0.8);
            MP.sendState();
            MP.broadcastToAll({ type: 'shieldActivate' });
        }

        // Checa se algum oponente chegou perto demais do jogador local enquanto ele está escudado.
        // Se sim, o oponente é quem toma dano e knockback (o escudo "reflete" o contato).
        function checkShieldContact(p, now) {
            if (!p.isShielding) return;
            if (!p.attackUntil || now >= p.attackUntil) return; // segurança extra, caso já tenha acabado
            for (const id in players) {
                if (id === myUserId) continue;
                if (p.shieldHitIds.includes(id)) continue;
                const target = players[id];
                const dx = Math.abs(target.x - p.x);
                const dy = Math.abs(target.y - p.y);
                if (dx < SHIELD_CONTACT_RANGE && dy < PLAYER_SIZE * 0.9) {
                    p.shieldHitIds.push(id);
                    const dir = target.x >= p.x ? 1 : -1;
                    applyHit(id, SHIELD_REFLECT_DAMAGE, SHIELD_REFLECT_KNOCKBACK, dir);
                    MP.broadcastToAll({ type: 'hit', targetId: id, damage: SHIELD_REFLECT_DAMAGE, knockback: SHIELD_REFLECT_KNOCKBACK, dir });
                    SFX.playHit('medium');
                    rumble(0.4, 120);
                }
            }
        }

        // Física da bala: linha reta simples, some depois de BULLET_LIFETIME
        function updateBullets(deltaMs) {
            const deltaSec = deltaMs / 1000;
            const now = Date.now();
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (now - b.spawnTime >= BULLET_LIFETIME) { bullets.splice(i, 1); continue; }
                b.x += b.dir * BULLET_SPEED * deltaSec;

                if (b.ownerId === myUserId) {
                    for (const id in players) {
                        if (id === b.ownerId || b.hitIds.includes(id)) continue;
                        const target = players[id];
                        if (Math.abs(target.x - b.x) < 26 && Math.abs(target.y - b.y) < PLAYER_SIZE * 0.9) {
                            b.hitIds.push(id);
                            const dir = target.x >= b.x ? 1 : -1;
                            applyHit(id, BULLET_DAMAGE, BULLET_KNOCKBACK, dir);
                            MP.broadcastToAll({ type: 'hit', targetId: id, damage: BULLET_DAMAGE, knockback: BULLET_KNOCKBACK, dir });
                            MP.broadcastToAll({ type: 'bulletRemove', bulletId: b.id });
                            bullets.splice(i, 1);
                            break; // a bala some ao acertar (não atravessa múltiplos jogadores)
                        }
                    }
                }
            }
        }

        function drawBullets() {
            const sprites = CHARACTERS.renanAntigo.bulletSprites;
            const frameIndex = Math.floor(Date.now() / WALK_FRAME_DURATION) % sprites.length;
            const sprite = sprites[frameIndex];
            if (!sprite || !sprite.complete || sprite.naturalWidth === 0) return;
            const drawH = 11;
            const drawW = drawH * (sprite.naturalWidth / sprite.naturalHeight);
            for (const b of bullets) {
                ctx.save();
                ctx.translate(b.x, b.y);
                if (b.dir < 0) ctx.scale(-1, 1);
                ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();
            }
        }


        // ==========================================
        // JELLY BALLS (Blui e Reddie) — física do balão de gelatina em versão mini
        // ==========================================
        function createJellyBall(data) {
            const r = data.radius || JELLY_RADIUS;
            const points = [];
            for (let i = 0; i < JELLY_POINTS; i++) {
                const a = (i * Math.PI * 2) / JELLY_POINTS;
                points.push({
                    x: data.x + Math.cos(a) * r,
                    y: data.y + Math.sin(a) * r,
                    vx: data.vx / 60 / JELLY_SUB_STEPS, // px/s -> px por sub-passo (simulação a 60Hz)
                    vy: data.vy / 60 / JELLY_SUB_STEPS
                });
            }
            return {
                points,
                radius: r,
                color: data.color,
                ownerId: data.ownerId,
                spawnTime: Date.now() + (data.delay || 0), // inativa até esse instante (rajada escalonada)
                hitIds: []
            };
        }

        // X: cospe uma rajada de mini jelly balls pela boca (centro vertical do sprite)
        function spitJelly(p) {
            if (!p || p.character !== 'blui') return;
            const now = Date.now();
            if (p.hitstunUntil && now < p.hitstunUntil) return;
            if (p.attackUntil && now < p.attackUntil) return;
            if (p.attackCooldownUntil && now < p.attackCooldownUntil) return;

            const def = CHARACTERS.blui.attacks.spitJelly;
            p.attackName = 'spitJelly';
            p.attackStart = now;
            p.attackUntil = now + def.duration;
            p.attackCooldownUntil = now + def.duration + JELLY_COOLDOWN;
            p.attackSquashTime = now;

            const dir = p.facingLeft ? -1 : 1;
            // Boca = centro vertical do sprite: o sprite vai de (p.y - SPRITE_HEIGHT + PLAYER_SIZE/2) até (p.y + PLAYER_SIZE/2)
            const mouthY = p.y + PLAYER_SIZE / 2 - SPRITE_HEIGHT / 2;
            const mouthX = p.x + dir * 34;

            const balls = [];
            for (let i = 0; i < JELLY_COUNT; i++) {
                balls.push({
                    x: mouthX,
                    y: mouthY,
                    vx: dir * (300 + Math.random() * 160),
                    vy: -80 - Math.random() * 170,
                    delay: i * JELLY_STAGGER_MS,
                    color: JELLY_COLORS[0],
                    radius: JELLY_RADIUS * (0.85 + Math.random() * 0.3),
                    ownerId: myUserId
                });
            }
            for (const b of balls) jellyBalls.push(createJellyBall(b));
            SFX.playSwing(1.1);
            MP.sendState();
            MP.broadcastToAll({ type: 'jellySpit', balls });
        }

        // Um sub-passo da física do balão (mesmas 6 etapas do código original, sem arrasto do mouse)
        function jellyPhysicsSubstep(ball, stage, plats) {
            const pts = ball.points;
            const n = pts.length;
            const restLength = (2 * Math.PI * ball.radius) / n;
            const targetArea = Math.PI * ball.radius * ball.radius;

            // Gravidade
            for (const p of pts) p.vy += JELLY_GRAVITY;

            // Tensão superficial
            for (let i = 0; i < n; i++) {
                const p1 = pts[i], p2 = pts[(i + 1) % n];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 0.001) {
                    const force = (dist - restLength) * JELLY_K_EDGE;
                    const fx = (dx / dist) * force, fy = (dy / dist) * force;
                    p1.vx += fx; p1.vy += fy;
                    p2.vx -= fx; p2.vy -= fy;
                }
            }

            // Repulsão anti-dobras
            const minNodeDist = restLength * 0.6;
            for (let i = 0; i < n; i++) {
                const p1 = pts[i], p2 = pts[(i + 1) % n];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist < minNodeDist && dist > 0) {
                    const push = (minNodeDist - dist) * 0.25;
                    const fx = (dx / dist) * push, fy = (dy / dist) * push;
                    p1.vx -= fx; p1.vy -= fy;
                    p2.vx += fx; p2.vy += fy;
                }
            }

            // Pressão interna incompressível (Shoelace)
            let area = 0;
            for (let i = 0; i < n; i++) {
                const p1 = pts[i], p2 = pts[(i + 1) % n];
                area += (p1.x * p2.y - p2.x * p1.y);
            }
            area = Math.abs(area * 0.5);
            const pressure = (targetArea - area) * JELLY_PRESSURE;
            for (let i = 0; i < n; i++) {
                const prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n], p = pts[i];
                let nx = next.y - prev.y, ny = prev.x - next.x;
                const nLen = Math.hypot(nx, ny);
                if (nLen > 0.001) {
                    nx /= nLen; ny /= nLen;
                    p.vx += nx * pressure;
                    p.vy += ny * pressure;
                }
            }

            // Integração + colisão com o chão (palco e plataformas flutuantes: só por cima)
            const surfaces = [stage, ...plats];
            for (const p of pts) {
                const prevY = p.y;
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= JELLY_DAMPING;
                p.vy *= JELLY_DAMPING;

                for (const s of surfaces) {
                    if (p.x >= s.x && p.x <= s.x + s.width && prevY <= s.y + 1 && p.y > s.y) {
                        p.y = s.y;
                        p.vy *= -0.15; // gelatina esparrama em vez de quicar
                        p.vx *= 0.85;  // atrito no solo
                        break;
                    }
                }
            }
        }

        function jellyCentroid(ball) {
            let cx = 0, cy = 0;
            for (const p of ball.points) { cx += p.x; cy += p.y; }
            return { x: cx / ball.points.length, y: cy / ball.points.length };
        }

        function updateJellyBalls(deltaMs) {
            const now = Date.now();
            // Passo fixo de 60Hz (as constantes da física original foram calibradas assim)
            jellyAccumulator += Math.min(deltaMs, 100);
            let frames = 0;
            while (jellyAccumulator >= 1000 / 60 && frames < 4) { jellyAccumulator -= 1000 / 60; frames++; }
            if (jellyAccumulator > 1000 / 60) jellyAccumulator = 0;

            const stage = getStageRect();
            const plats = getFloatingPlatforms();

            for (let i = jellyBalls.length - 1; i >= 0; i--) {
                const ball = jellyBalls[i];
                if (now < ball.spawnTime) continue; // ainda esperando sua vez na rajada
                const c = jellyCentroid(ball);
                if (now - ball.spawnTime >= JELLY_LIFETIME || c.y > WORLD_HEIGHT + 300) { jellyBalls.splice(i, 1); continue; }

                for (let f = 0; f < frames; f++) {
                    for (let s = 0; s < JELLY_SUB_STEPS; s++) jellyPhysicsSubstep(ball, stage, plats);
                }

                // Dano: só o dono da bolinha processa (mesmo padrão das balas), propagado por rede
                if (ball.ownerId === myUserId) {
                    const cc = jellyCentroid(ball);
                    for (const id in players) {
                        if (id === ball.ownerId || ball.hitIds.includes(id)) continue;
                        const target = players[id];
                        if (target.eliminated) continue;
                        const targetCenterY = target.y + PLAYER_SIZE / 2 - SPRITE_HEIGHT / 2;
                        if (Math.abs(target.x - cc.x) < 22 + ball.radius && Math.abs(targetCenterY - cc.y) < SPRITE_HEIGHT / 2 + ball.radius * 0.5) {
                            ball.hitIds.push(id);
                            const dir = target.x >= cc.x ? 1 : -1;
                            applyHit(id, JELLY_DAMAGE, JELLY_KNOCKBACK, dir);
                            MP.broadcastToAll({ type: 'hit', targetId: id, damage: JELLY_DAMAGE, knockback: JELLY_KNOCKBACK, dir });
                        }
                    }
                }
            }
        }

        function drawJellyBalls() {
            const now = Date.now();
            for (const ball of jellyBalls) {
                if (now < ball.spawnTime) continue;
                const age = now - ball.spawnTime;
                const remaining = JELLY_LIFETIME - age;
                const pts = ball.points;
                const n = pts.length;

                ctx.save();
                if (remaining < JELLY_FADE_MS) ctx.globalAlpha = Math.max(0, remaining / JELLY_FADE_MS);
                ctx.beginPath();
                ctx.moveTo((pts[n - 1].x + pts[0].x) / 2, (pts[n - 1].y + pts[0].y) / 2);
                for (let i = 0; i < n; i++) {
                    const next = pts[(i + 1) % n];
                    ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + next.x) / 2, (pts[i].y + next.y) / 2);
                }
                ctx.fillStyle = ball.color; // cor sólida, sem luz nem sombra (igual ao balão original)
                ctx.fill();
                ctx.restore();
            }
        }

        function throwClipper(p) {
            if (!p || p.character !== 'aggie') return;
            if (p.hitstunUntil && Date.now() < p.hitstunUntil) return;
            if (p.clipperCooldownUntil && Date.now() < p.clipperCooldownUntil) return;

            const now = Date.now();
            p.clipperCooldownUntil = now + CLIPPER_COOLDOWN;
            p.clipperThrowFlashUntil = now + CHARACTERS.aggie.attacks.throwClipper.duration; // só pro sprite de arremesso piscar rápido
            p.attackSquashTime = now;

            const dir = p.facingLeft ? -1 : 1;
            const clipper = {
                id: 'clipper_' + now + '_' + Math.floor(Math.random() * 100000),
                x: p.x + dir * 20,
                y: p.y - PLAYER_SIZE * 0.5,
                startX: p.x + dir * 20,
                dir,
                hasReturned: false,
                hitIds: [], // ids já atingidos nesta "perna" (ida ou volta), evita hit múltiplo instantâneo
                spawnTime: now,
                ownerId: myUserId
            };
            nailClippers.push(clipper);
            SFX.playSwing(1);
            MP.sendState();
            MP.broadcastToAll({ type: 'clipperThrow', clipper });
        }

        // Física do alicate: linha reta na ida, inverte ao alcançar CLIPPER_MAX_DISTANCE e
        // volta até o dono (ou até CLIPPER_LIFETIME expirar, o que vier primeiro). Usa
        // ease-in-out (progresso temporal, não velocidade constante) pra ida e volta terem
        // uma aceleração/desaceleração suave em vez de movimento robótico.
        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        function updateNailClippers(deltaMs) {
            const now = Date.now();
            for (let i = nailClippers.length - 1; i >= 0; i--) {
                const c = nailClippers[i];
                if (now - c.spawnTime >= CLIPPER_LIFETIME) { nailClippers.splice(i, 1); continue; }

                if (!c.hasReturned) {
                    const legDuration = (CLIPPER_MAX_DISTANCE / CLIPPER_SPEED) * 1000; // ms pra percorrer a ida
                    const t = Math.min(1, (now - c.spawnTime) / legDuration);
                    c.x = c.startX + c.dir * CLIPPER_MAX_DISTANCE * easeInOutQuad(t);
                    if (t >= 1) {
                        c.hasReturned = true;
                        c.hitIds = []; // permite acertar de novo na volta
                    }
                } else {
                    // Segue a posição ATUAL do dono a cada frame (não um alvo fixo do início da
                    // volta), para dar a sensação de "voltar para a mão dela" mesmo que ela se
                    // mova. Ease-out por proximidade: desacelera suavemente ao se aproximar.
                    const owner = players[c.ownerId];
                    const targetX = owner ? owner.x : c.startX;
                    const targetY = owner ? owner.y - PLAYER_SIZE * 0.5 : c.y;
                    const distX = targetX - c.x;
                    const distY = targetY - c.y;
                    const dist = Math.hypot(distX, distY);
                    if (owner && dist < 20) { nailClippers.splice(i, 1); continue; } // a Aggie pegou o alicate de volta

                    const step = Math.min(dist, CLIPPER_SPEED * (deltaMs / 1000) * easeInOutQuad(Math.min(1, dist / 120)));
                    if (dist > 0.001) {
                        c.x += (distX / dist) * step;
                        c.y += (distY / dist) * step;
                    }
                }

                // Dano: só o dono processa a colisão (mesmo padrão dos outros ataques), propaga por rede
                if (c.ownerId === myUserId) {
                    for (const id in players) {
                        if (id === c.ownerId || c.hitIds.includes(id)) continue;
                        const target = players[id];
                        if (Math.abs(target.x - c.x) < 34 && Math.abs(target.y - c.y) < PLAYER_SIZE * 0.9) {
                            c.hitIds.push(id);
                            const dir = target.x >= c.x ? 1 : -1;
                            applyHit(id, CLIPPER_DAMAGE, CLIPPER_KNOCKBACK, dir);
                            MP.broadcastToAll({ type: 'hit', targetId: id, damage: CLIPPER_DAMAGE, knockback: CLIPPER_KNOCKBACK, dir });
                        }
                    }
                }
            }
        }

        function drawNailClippers() {
            const sprite = CHARACTERS.aggie.sprites.clip;
            if (!sprite || !sprite.complete || sprite.naturalWidth === 0) return;
            const drawH = 42;
            const drawW = drawH * (sprite.naturalWidth / sprite.naturalHeight);
            for (const c of nailClippers) {
                ctx.save();
                ctx.translate(c.x, c.y);
                // Gira continuamente enquanto voa, efeito de rotação do boomerang
                ctx.rotate((Date.now() % 400) / 400 * Math.PI * 2);
                ctx.drawImage(sprite, -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();
            }
        }

        // Física + explosão dos frascos de esmalte: cai com gravidade, assenta no chão da
        // plataforma mais próxima, e depois de POLISH_EXPLODE_DELAY explode causando dano em área.
        function updateNailPolishBottles(deltaMs) {
            const deltaSec = deltaMs / 1000;
            for (let i = nailPolishBottles.length - 1; i >= 0; i--) {
                const b = nailPolishBottles[i];
                if (b.exploded) { nailPolishBottles.splice(i, 1); continue; }

                if (!b.onGround) {
                    const prevY = b.y;
                    b.vy += GRAVITY * 0.5 * deltaSec; // cai mais devagar que um jogador (frasco leve)
                    b.x += b.vx * deltaSec;
                    b.y += b.vy * deltaSec;

                    const stage = getStageRect();
                    const groundY = stage.y;
                    const cameFromAboveGround = prevY <= groundY;
                    if (cameFromAboveGround && b.vy >= 0 && b.y >= groundY && b.x >= stage.x && b.x <= stage.x + stage.width) {
                        b.y = groundY;
                        b.onGround = true;
                        b.vx = 0;
                        b.vy = 0;
                        b.landTime = Date.now();
                    }
                    for (const fp of getFloatingPlatforms()) {
                        const cameFromAboveFp = prevY <= fp.y;
                        if (cameFromAboveFp && b.vy >= 0 && b.y >= fp.y && b.x >= fp.x && b.x <= fp.x + fp.width) {
                            b.y = fp.y;
                            b.onGround = true;
                            b.vx = 0;
                            b.vy = 0;
                            b.landTime = Date.now();
                            break;
                        }
                    }
                } else if (Date.now() - b.landTime >= POLISH_EXPLODE_DELAY) {
                    explodePolishBottle(b);
                }
            }
        }

        // Explosão: dano em área nos jogadores próximos + efeito visual de líquido (só quem
        // arremessou processa o dano, igual ao padrão dos outros ataques, e propaga por rede)
        function explodePolishBottle(b) {
            b.exploded = true;
            spawnPolishSplash(b.x, b.y, b.color);
            if (b.ownerId === myUserId) {
                for (const id in players) {
                    if (id === b.ownerId) continue; // não leva dano da própria explosão
                    const target = players[id];
                    const dx = target.x - b.x;
                    const dy = target.y - b.y;
                    if (Math.hypot(dx, dy) < POLISH_EXPLOSION_RADIUS) {
                        const dir = dx >= 0 ? 1 : -1;
                        if (id === myUserId) {
                            applyHit(id, POLISH_DAMAGE, POLISH_KNOCKBACK, dir);
                        }
                        MP.broadcastToAll({ type: 'hit', targetId: id, damage: POLISH_DAMAGE, knockback: POLISH_KNOCKBACK, dir });
                    }
                }
            }
        }


        // Inicia um golpe de melee para qualquer jogador (soco com combo em 2 hits, ou chute avulso)
        function startAttack(p, name) {
            if (!p) return;
            const charAttacks = (CHARACTERS[p.character] || CHARACTERS.renanzinho).attacks;
            const def = charAttacks[name];
            if (!def) return;
            if (p.hitstunUntil && Date.now() < p.hitstunUntil) return; // não pode atacar tomando hitstun
            if (p.isDoubleJumping) return; // não pode atacar depois de usar o pulo duplo (até pousar)

            const now = Date.now();

            // Se já está atacando, só aceita input de combo (soco 1 -> soco 2 -> chute) dentro da janela certa
            if (p.attackUntil && now < p.attackUntil) {
                if (p.pendingCombo && p.hasHitThisAttack && p.attackName === 'punch1' && name === 'punch1' &&
                    now >= p.attackStart + def.activeEnd && now <= p.attackStart + def.duration + charAttacks.punch1.comboWindow) {
                    p.queuedAttack = 'punch2';
                } else if (p.pendingCombo && p.hasHitThisAttack && p.attackName === 'punch2' && name === 'kick' &&
                    now >= p.attackStart + charAttacks.punch2.activeEnd && now <= p.attackStart + charAttacks.punch2.duration + charAttacks.punch2.comboWindow) {
                    p.queuedAttack = 'kick';
                }
                return;
            }
            if (p.attackCooldownUntil && now < p.attackCooldownUntil) return;

            p.attackName = name;
            p.attackStart = now;
            p.attackUntil = now + def.duration;
            p.hasHitThisAttack = false;
            p.pendingCombo = !!def.next;
            p.queuedAttack = null;
            p.attackSquashTime = now;
            if (name === 'nail') {
                const dir = p.facingLeft ? -1 : 1;
                spawnClawEffect(p.x + dir * 38, p.y - PLAYER_SIZE * 0.35, dir);
            }
            SFX.playSwing(name === 'kick' ? 1.3 : 1);
            MP.sendState();
        }

        // Atualiza o golpe em andamento: detecta o fim, encadeia combo, e checa a hitbox contra oponentes
        function updateAttack(p, now) {
            if (!p.attackUntil) return;
            const charAttacks = (CHARACTERS[p.character] || CHARACTERS.renanzinho).attacks;

            if (now >= p.attackUntil) {
                // Golpe terminou: se havia um combo enfileirado (soco 2), encadeia sem gap
                if (p.queuedAttack) {
                    const next = p.queuedAttack;
                    const def = charAttacks[next];
                    p.attackName = next;
                    p.attackStart = now;
                    p.attackUntil = now + def.duration;
                    p.hasHitThisAttack = false;
                    p.pendingCombo = !!def.next;
                    p.queuedAttack = null;
                } else {
                    const finishedDef = charAttacks[p.attackName];
                    const wasShielding = p.attackName === 'shield';
                    p.attackName = null;
                    p.attackUntil = 0;
                    p.attackCooldownUntil = now + (finishedDef && finishedDef.cooldown !== undefined ? finishedDef.cooldown : ATTACK_COOLDOWN);
                    if (wasShielding) {
                        p.isShielding = false;
                        p.shieldCooldownUntil = now + finishedDef.cooldown; // cooldown próprio de 2s após o escudo acabar
                    }
                }
                return;
            }

            if (p.attackName === 'shield') {
                checkShieldContact(p, now); // enquanto o escudo está ativo, checa se algum oponente chegou perto
                return;
            }

            const def = charAttacks[p.attackName];
            if (!def) return; // ataque sem hitbox de melee (ex.: throwPolish, que dá dano pela explosão)
            const elapsed = now - p.attackStart;

            // Hitbox só está "ativa" durante a janela de frames de acerto do golpe
            if (!p.hasHitThisAttack && elapsed >= def.activeStart && elapsed <= def.activeEnd) {
                const dir = p.facingLeft ? -1 : 1;
                const hitboxX = p.x + dir * def.range * 0.55;

                for (const id in players) {
                    if (id === myUserId) continue;
                    const target = players[id];
                    const dx = Math.abs(target.x - hitboxX);
                    const dy = Math.abs(target.y - p.y);
                    if (dx < def.range * 0.6 && dy < PLAYER_SIZE * 0.9) {
                        p.hasHitThisAttack = true;
                        const knockback = def.baseKnockback + (target.damage || 0) * def.growth;
                        applyHit(id, def.damage, knockback, dir);
                        MP.broadcastToAll({ type: 'hit', targetId: id, damage: def.damage, knockback, dir });

                        // Conta quantos golpes seguidos do combo acertaram (só para a cadeia
                        // punch1 -> punch2 -> kick do Renanzinho; outros ataques, como a unhada
                        // da Aggie, nunca mostram a mensagem de combo)
                        const isComboChainAttack = p.attackName === 'punch1' || p.attackName === 'punch2' || p.attackName === 'kick';
                        p.comboHits = isComboChainAttack ? ((p.attackName === 'punch1') ? 1 : (p.comboHits || 0) + 1) : 0;

                        // Feedback do impacto também para quem deu o golpe (não só para quem recebeu)
                        const atkKnockback = knockback * (1 + Math.max(0, (target.damage || 0) - 100) * 0.012);
                        const atkIsStrong = atkKnockback >= STRONG_HIT_THRESHOLD;
                        SFX.playHit(atkIsStrong ? 'strong' : (p.attackName === 'kick' ? 'medium' : 'light'));
                        if (p.comboHits >= 3) {
                            spawnComboPopup(target.x, target.y - 70, p.comboHits);
                        }
                        if (atkIsStrong) {
                            cameraFX.freezeUntil = Date.now() + IMPACT_FREEZE_MS;
                        }
                        rumble(atkIsStrong ? 0.6 : 0.3, atkIsStrong ? 160 : 90);
                        break;
                    }
                }
            }
        }

        // Aplica o golpe sofrido: soma dano%, empurra (knockback maior quanto mais % a vítima já tem) e trava em hitstun
        function applyHit(targetId, damage, knockback, dir) {
            const target = players[targetId];
            if (!target) return;
            if (target.isShielding) return; // escudo ativo: bloqueia qualquer dano recebido

            target.damage = (target.damage || 0) + damage;

            // Quanto maior o dano acumulado da vítima, mais longe ela voa — crescimento acelerado
            // acima de 100% (igual à "sensação" de estar a um golpe do nocaute no Smash).
            const dmgAfter = target.damage;
            const rageMultiplier = 1 + Math.max(0, dmgAfter - 100) * 0.012;
            const finalKnockback = knockback * rageMultiplier;

            target.knockbackVx = dir * finalKnockback;
            target.vy = -Math.max(finalKnockback * 0.9, 220, Math.sqrt(finalKnockback) * 40);
            target.y -= 4; // garante que já saia do chão antes do hitstop, evitando reaterrissar no mesmo frame
            target.onGround = false;
            target.hitFlashTime = Date.now();
            target.hitstunUntil = Date.now() + finalKnockback * HITSTUN_PER_KNOCKBACK;

            // Interrompe qualquer golpe que a vítima estivesse no meio de fazer
            target.attackName = null;
            target.attackUntil = 0;
            target.queuedAttack = null;

            const isStrong = finalKnockback >= STRONG_HIT_THRESHOLD;
            const isKO = finalKnockback >= KO_HIT_THRESHOLD;
            if (isKO) SFX.playHit('ko');

            // Faíscas de impacto + número de dano flutuante em todo golpe (mais
            // dramático nos fortes), e screen shake proporcional à força do golpe.
            // Roda em applyHit (não só onde o golpe foi detectado) para que TODOS os
            // jogadores vejam o efeito na vítima, não só quem desferiu o golpe.
            spawnHitEffects(target.x, target.y - 20, dir, isStrong);
            spawnDamagePopup(target.x, target.y - 40, damage, isStrong);

            // Golpe quase-fatal: raio vermelho/preto na tela toda + linhas de velocidade
            // acompanhando o voo, estilo Smash Ultimate
            if (false) spawnKOEffects(dir);

            // Golpe forte: congela o jogo por um instante (hitstop)
            if (isStrong) {
                cameraFX.freezeUntil = Date.now() + IMPACT_FREEZE_MS;
            }

            // Vibração do controle (Gamepad API): intensidade proporcional à força do golpe.
            // Só vibra o controle de quem está jogando localmente como a vítima.
            if (targetId === myUserId) {
                rumble(isKO ? 1.0 : isStrong ? 0.6 : 0.3, isKO ? 260 : isStrong ? 160 : 90);
            }

            if (targetId === myUserId) MP.sendState();
        }

        // Desenha a plataforma (ilha flutuante com base pontuda)
        function drawFloatingPlatform(fp) {
            const extrude = 14; // extrude menor, proporcional ao tamanho reduzido da plataforma

            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.moveTo(fp.x, fp.y);
            ctx.lineTo(fp.x + fp.width, fp.y);
            ctx.lineTo(fp.x + fp.width + extrude, fp.y - extrude);
            ctx.lineTo(fp.x + extrude, fp.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#9a9a9a';
            ctx.beginPath();
            ctx.moveTo(fp.x + fp.width, fp.y);
            ctx.lineTo(fp.x + fp.width, fp.y + fp.height);
            ctx.lineTo(fp.x + fp.width + extrude, fp.y + fp.height - extrude);
            ctx.lineTo(fp.x + fp.width + extrude, fp.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7a7a7a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(fp.x, fp.y, fp.width, fp.height);
            ctx.strokeStyle = '#bbbbbb';
            ctx.lineWidth = 2;
            ctx.strokeRect(fp.x, fp.y, fp.width, fp.height);
        }

        function drawStage() {
            const stage = getStageRect();
            const extrude = 22; // profundidade do "skew" (equivalente ao 60px do CSS, escalado)
            (MAPS[currentMapIndex] || MAPS[0]).drawStageFill(stage, extrude);

            // Plataformas flutuantes pequenas por cima da plataforma principal
            const floatPlats = getFloatingPlatforms();
            for (const fp of floatPlats) {
                drawFloatingPlatform(fp);
            }
        }

        // Preenchimento do palco do mapa "Cubos" (visual cinza original)
        function drawCubesStageFill(stage, extrude) {
            // Face de cima (topo, mais clara - simula luz) - paralelogramo tipo skewX(-45deg), origem bottom-left
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.moveTo(stage.x, stage.y);
            ctx.lineTo(stage.x + stage.width, stage.y);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y - extrude);
            ctx.lineTo(stage.x + extrude, stage.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Face lateral direita (mais escura - simula sombra) - paralelogramo tipo skewY
            ctx.fillStyle = '#9a9a9a';
            ctx.beginPath();
            ctx.moveTo(stage.x + stage.width, stage.y);
            ctx.lineTo(stage.x + stage.width, stage.y + stage.height);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y + stage.height - extrude);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7a7a7a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Face da frente (cor base)
            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(stage.x, stage.y, stage.width, stage.height);
            ctx.strokeStyle = '#bbbbbb';
            ctx.lineWidth = 2;
            ctx.strokeRect(stage.x, stage.y, stage.width, stage.height);
        }

        // Preenchimento do palco do mapa "Colinas" (relva verde + base marrom, do mapa enviado)
        function drawHillsStageFill(stage, extrude) {
            // topo da relva verde
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.moveTo(stage.x, stage.y);
            ctx.lineTo(stage.x + stage.width, stage.y);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y - extrude);
            ctx.lineTo(stage.x + extrude, stage.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 2;
            ctx.stroke();

            // lateral 3D
            ctx.fillStyle = '#5C3A1E';
            ctx.beginPath();
            ctx.moveTo(stage.x + stage.width, stage.y);
            ctx.lineTo(stage.x + stage.width, stage.y + stage.height);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y + stage.height - extrude);
            ctx.lineTo(stage.x + stage.width + extrude, stage.y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#3D2613';
            ctx.lineWidth = 2;
            ctx.stroke();

            // face frontal da plataforma
            ctx.fillStyle = '#8B5A2B';
            ctx.fillRect(stage.x, stage.y, stage.width, stage.height);
            ctx.strokeStyle = '#5D3A1D';
            ctx.lineWidth = 2;
            ctx.strokeRect(stage.x, stage.y, stage.width, stage.height);
        }

        // Fundo do mapa "Colinas": céu, monolito "BOS" e três camadas de montanhas com parallax.
        // O fundo já é desenhado com um deslocamento base de -follow * PARALLAX_FOLLOW_FRACTION
        // (veja o gameLoop). Por isso cada camada compensa esse valor: o movimento final na tela
        // é exatamente HILLS_PARALLAX[camada] * movimento da câmera (0 = parada, 1 = igual ao palco).
        // Quanto mais longe a camada, menor o fator, ou seja, menos ela se mexe.
        const HILLS_PARALLAX = {
            far: 0.04,       // montanha distante: quase parada
            monolith: 0.10,  // monolito BOS (entre a distante e a média)
            mid: 0.18,       // montanha média
            front: 0.30      // montanha frontal: a que mais acompanha a câmera
        };
        function hillsLayerShift(followX, followY, factor) {
            const k = PARALLAX_FOLLOW_FRACTION - factor;
            ctx.translate(followX * k, followY * k);
        }

        function drawHillsMonolith(followX, followY) {
            ctx.save();
            hillsLayerShift(followX, followY, HILLS_PARALLAX.monolith);

            const posX = WORLD_WIDTH * 0.72;
            const posY = 380;
            const rectWidth = 110;
            const rectHeight = 430;
            const tiltAngle = 0.18;

            ctx.translate(posX, posY);
            ctx.rotate(tiltAngle);

            const depth = 20;

            ctx.fillStyle = '#9aa5b3';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(rectWidth, 0);
            ctx.lineTo(rectWidth + depth, -depth * 0.5);
            ctx.lineTo(depth, -depth * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#535b66';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#454c54';
            ctx.beginPath();
            ctx.moveTo(rectWidth, 0);
            ctx.lineTo(rectWidth + depth, -depth * 0.5);
            ctx.lineTo(rectWidth + depth, rectHeight - depth * 0.5);
            ctx.lineTo(rectWidth, rectHeight);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2d3238';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#788391';
            ctx.fillRect(0, 0, rectWidth, rectHeight);
            ctx.strokeStyle = '#3a4047';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, rectWidth, rectHeight);

            const fontSize = 54;
            ctx.font = `900 ${fontSize}px "Impact", "Arial Black", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';

            const textX = rectWidth / 2 + depth / 2;
            const textY = -depth * 0.5 - 5;

            ctx.fillStyle = '#1c2229';
            ctx.fillText('BOS', textX + 3, textY + 3);

            ctx.fillStyle = '#ffffff';
            ctx.fillText('BOS', textX, textY);
            ctx.strokeStyle = '#1a1d20';
            ctx.lineWidth = 3;
            ctx.strokeText('BOS', textX, textY);

            ctx.restore();
        }

        function drawHillsBackground(followX, followY) {
            const M = 3000; // margem extra nas bordas para o parallax não revelar vazio

            // Montanha distante
            ctx.save();
            hillsLayerShift(followX, followY, HILLS_PARALLAX.far);
            ctx.fillStyle = '#7dbb8a';
            ctx.beginPath();
            ctx.moveTo(-M, WORLD_HEIGHT + M);
            ctx.lineTo(-M, 520);
            ctx.bezierCurveTo(WORLD_WIDTH * 0.25, 380, WORLD_WIDTH * 0.45, 560, WORLD_WIDTH * 0.65, 460);
            ctx.bezierCurveTo(WORLD_WIDTH * 0.8, 380, WORLD_WIDTH * 0.9, 480, WORLD_WIDTH + M, 440);
            ctx.lineTo(WORLD_WIDTH + M, WORLD_HEIGHT + M);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#529160';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Monolito BOS
            drawHillsMonolith(followX, followY);

            // Montanha média
            ctx.save();
            hillsLayerShift(followX, followY, HILLS_PARALLAX.mid);
            ctx.fillStyle = '#51a162';
            ctx.beginPath();
            ctx.moveTo(-M, WORLD_HEIGHT + M);
            ctx.lineTo(-M, 580);
            ctx.quadraticCurveTo(WORLD_WIDTH * 0.18, 460, WORLD_WIDTH * 0.38, 540);
            ctx.quadraticCurveTo(WORLD_WIDTH * 0.58, 620, WORLD_WIDTH * 0.78, 500);
            ctx.quadraticCurveTo(WORLD_WIDTH * 0.92, 420, WORLD_WIDTH + M, 520);
            ctx.lineTo(WORLD_WIDTH + M, WORLD_HEIGHT + M);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#327841';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Montanha frontal
            ctx.save();
            hillsLayerShift(followX, followY, HILLS_PARALLAX.front);
            ctx.fillStyle = '#3b874c';
            ctx.beginPath();
            ctx.moveTo(-M, WORLD_HEIGHT + M);
            ctx.lineTo(-M, 680);
            ctx.bezierCurveTo(WORLD_WIDTH * 0.15, 560, WORLD_WIDTH * 0.35, 620, WORLD_WIDTH * 0.5, 670);
            ctx.bezierCurveTo(WORLD_WIDTH * 0.68, 730, WORLD_WIDTH * 0.85, 590, WORLD_WIDTH + M, 650);
            ctx.lineTo(WORLD_WIDTH + M, WORLD_HEIGHT + M);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#215c30';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }




        // ==========================================================================
        // MAPA "DORFic" (adaptado do parallax-laranja.html: CSS -> canvas)
        // Camadas, da mais distante para a mais próxima: céu, raios de luz, pilares
        // distantes, chão de meio-tom (halftone) em perspectiva, pilares próximos e
        // partículas. Igual ao Colinas, cada camada compensa o deslocamento base do
        // gameLoop, então o movimento final na tela é DORFIC_PARALLAX[camada] * câmera:
        // quanto mais longe, menos a camada se mexe.
        // ==========================================================================
        const DORFIC_PARALLAX = {
            sky: 0.01,
            rays: 0.02,
            beamsFar: 0.06,
            floor: 0.12,
            beamsNear: 0.20,
            dust: 0.30
        };

        // { left%, top% (da camada), w (vw), h (vh), rot (graus), skew (graus), delay (s) }
        const DORFIC_BEAMS_FAR = [
            { l: 40, t: 32, w: 4,   h: 11, rot: 0, skew: 0,   delay: 0 },
            { l: 48, t: 33, w: 4,   h: 11, rot: 0, skew: 0,   delay: 1 },
            { l: 61, t: 36, w: 4,   h: 14, rot: 0, skew: 0,   delay: 2 },
            { l: 72, t: 33, w: 5,   h: 11, rot: 0, skew: -12, delay: 3 },
            { l: 41, t: 44, w: 4.5, h: 11, rot: 0, skew: 0,   delay: 1.5 }
        ];
        const DORFIC_BEAMS_NEAR = [
            { l: 14, t: 45, w: 15, h: 26, rot: 6,  skew: 0, delay: 0 },
            { l: 57, t: 56, w: 12, h: 30, rot: 0,  skew: 0, delay: 2 },
            { l: 74, t: 55, w: 14, h: 20, rot: -8, skew: 0, delay: 1 }
        ];
        // { left%, top%, tamanho (px), círculo?, delay (s) }
        const DORFIC_DUST = [
            { l: 78, t: 72, size: 22, round: false, delay: 0 },
            { l: 12, t: 66, size: 8,  round: true,  delay: 2 },
            { l: 33, t: 48, size: 6,  round: true,  delay: 4 },
            { l: 88, t: 40, size: 10, round: true,  delay: 1 },
            { l: 55, t: 82, size: 14, round: false, delay: 3 }
        ];

        // Onda triangular suavizada (equivale a "animation: ... alternate ease-in-out" do CSS)
        function dorficPingPong(timeMs, halfPeriodMs) {
            const cycle = halfPeriodMs * 2;
            const p = (((timeMs % cycle) + cycle) % cycle) / halfPeriodMs; // 0..2
            const tri = p < 1 ? p : 2 - p;
            return 0.5 - 0.5 * Math.cos(Math.PI * tri); // 0..1 com easing
        }

        // As camadas do CSS eram maiores que a tela (inset -20vh -10vw): converte % da camada em coords do mundo
        function dorficLayerX(pct) { return -0.1 * WORLD_WIDTH + (pct / 100) * 1.2 * WORLD_WIDTH; }
        function dorficLayerY(pct) { return -0.2 * WORLD_HEIGHT + (pct / 100) * 1.4 * WORLD_HEIGHT; }

        function drawDorficBeams(list, now) {
            for (const b of list) {
                const w = b.w * WORLD_WIDTH / 100;
                const h = b.h * WORLD_HEIGHT / 100;
                const cx = dorficLayerX(b.l) + w / 2;
                const cy = dorficLayerY(b.t) + h / 2;
                const glow = 0.75 + 0.25 * dorficPingPong(now + b.delay * 1000, 4000);

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(b.rot * Math.PI / 180);
                if (b.skew) ctx.transform(1, 0, Math.tan(b.skew * Math.PI / 180), 1, 0, 0);

                // gradiente a 170deg: (sin, -cos) em coordenadas de tela
                const ang = 170 * Math.PI / 180;
                const dx = Math.sin(ang), dy = -Math.cos(ang);
                const len = Math.abs(w * dx) + Math.abs(h * dy);
                const grad = ctx.createLinearGradient(-dx * len / 2, -dy * len / 2, dx * len / 2, dy * len / 2);
                grad.addColorStop(0, '#fffbe0');
                grad.addColorStop(0.45, '#ffe27a');
                grad.addColorStop(1, 'rgba(255,160,40,0)');

                // clip-path: polygon(6% 0, 100% 14%, 62% 100%, 22% 92%)
                ctx.beginPath();
                ctx.moveTo(-w / 2 + w * 0.06, -h / 2);
                ctx.lineTo(-w / 2 + w * 1.00, -h / 2 + h * 0.14);
                ctx.lineTo(-w / 2 + w * 0.62, -h / 2 + h * 1.00);
                ctx.lineTo(-w / 2 + w * 0.22, -h / 2 + h * 0.92);
                ctx.closePath();

                ctx.globalAlpha = glow;
                ctx.shadowColor = 'rgba(255,235,150,0.9)';
                ctx.shadowBlur = 14;
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }
        }

        // Chão de meio-tom em perspectiva: pontos numa grade no plano do chão, projetados
        // com z = 1 + profundidade/D. A grade desliza em direção à câmera (5s por ciclo).
        function drawDorficFloor(now) {
            const horizonY = WORLD_HEIGHT * 0.42;
            const nearY = WORLD_HEIGHT * 1.1;
            const D = 230;             // "distância de perspectiva" (px do plano)
            const zMax = 3.6;          // além disso o chão já sumiu (máscara)
            const pitchX = 56;         // espaço horizontal entre pontos (plano)
            const rowStep = 14;        // espaço entre fileiras (fileiras alternam de cor e de deslocamento)
            const phase = ((now / 5000) * rowStep * 2) % (rowStep * 2);
            const dMax = (zMax - 1) * D;
            const xMin = -0.3 * WORLD_WIDTH, xMax = 1.3 * WORLD_WIDTH;
            const cx = WORLD_WIDTH / 2;

            for (let k = -6; ; k++) {
                const d = k * rowStep - phase;
                if (d > dMax) break;
                const z = 1 + d / D;
                if (z <= 0.5) continue;
                const t = (z - 1) / (zMax - 1);           // 0 = perto, 1 = longe
                const alpha = t < 0.25 ? 1 : Math.max(0, 1 - (t - 0.25) / 0.67); // máscara: opaco embaixo, some em cima
                if (alpha < 0.04) continue;

                const scale = 1 / z;
                const sy = horizonY + (nearY - horizonY) * scale;
                const rx = 10 * scale;
                const ry = rx * 0.45;                      // achatamento do plano inclinado
                const odd = (k & 1) !== 0;
                const offset = odd ? pitchX / 2 : 0;
                const jMin = Math.ceil(((xMin - cx) * z - offset) / pitchX);
                const jMax = Math.floor(((xMax - cx) * z - offset) / pitchX);

                ctx.beginPath();
                for (let j = jMin; j <= jMax; j++) {
                    const sx = cx + (j * pitchX + offset) * scale;
                    ctx.moveTo(sx + rx, sy);
                    ctx.ellipse(sx, sy, rx, ry, 0, 0, Math.PI * 2);
                }
                ctx.fillStyle = odd ? `rgba(255,190,90,${(0.7 * alpha).toFixed(3)})` : `rgba(255,205,110,${(0.95 * alpha).toFixed(3)})`;
                ctx.fill();
            }
        }

        function drawDorficBackground(followX, followY) {
            const M = 3000;
            const now = Date.now();
            const W = WORLD_WIDTH, H = WORLD_HEIGHT;

            // 1. Céu (gradiente + brilho do sol no topo)
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.sky);
            const sky = ctx.createLinearGradient(0, -0.2 * H, 0, 1.2 * H);
            sky.addColorStop(0, '#ffb400');
            sky.addColorStop(0.30, '#ff8a00');
            sky.addColorStop(0.58, '#f4620a');
            sky.addColorStop(1, '#ec4308');
            ctx.fillStyle = sky;
            ctx.fillRect(-M, -M, W + 2 * M, H + 2 * M);

            const glowRx = 0.45 * 1.2 * W, glowRy = 0.40 * 1.4 * H;
            ctx.translate(W / 2, dorficLayerY(12));
            ctx.scale(1, glowRy / glowRx);
            const sun = ctx.createRadialGradient(0, 0, 0, 0, 0, glowRx);
            sun.addColorStop(0, '#fff3a0');
            sun.addColorStop(0.30, '#ffd21a');
            sun.addColorStop(0.75, 'rgba(255,210,26,0)');
            ctx.fillStyle = sun;
            ctx.fillRect(-glowRx, -glowRx, glowRx * 2, glowRx * 2); // espaço já escalado: cobre a elipse inteira
            ctx.restore();

            // 2. Raios de luz (gradiente cônico pulsando entre 35% e 70%)
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.rays);
            ctx.globalAlpha = 0.35 + 0.35 * dorficPingPong(now, 8000);
            const rayCx = W / 2, rayCy = dorficLayerY(45);
            const rayCol = (a) => `rgba(255,230,140,${a})`;
            if (ctx.createConicGradient) {
                // CSS: from 200deg (0deg = topo); canvas: 0 = direita, então -90deg
                const conic = ctx.createConicGradient((200 - 90) * Math.PI / 180, rayCx, rayCy);
                conic.addColorStop(0, rayCol(0));
                conic.addColorStop(0.08, rayCol(0));
                conic.addColorStop(0.10, rayCol(0.35));
                conic.addColorStop(0.13, rayCol(0));
                conic.addColorStop(0.30, rayCol(0));
                conic.addColorStop(0.33, rayCol(0.30));
                conic.addColorStop(0.36, rayCol(0));
                conic.addColorStop(0.60, rayCol(0));
                conic.addColorStop(0.63, rayCol(0.35));
                conic.addColorStop(0.66, rayCol(0));
                conic.addColorStop(1, rayCol(0));
                ctx.fillStyle = conic;
                ctx.fillRect(-M, -M, W + 2 * M, H + 2 * M);
            } else {
                // Fallback (navegadores sem gradiente cônico): três fatias suaves nos mesmos ângulos
                ctx.fillStyle = rayCol(0.3);
                for (const pct of [0.10, 0.33, 0.63]) {
                    const a = ((200 - 90) * Math.PI / 180) + pct * Math.PI * 2;
                    const spread = 0.05 * Math.PI * 2 / 2;
                    ctx.beginPath();
                    ctx.moveTo(rayCx, rayCy);
                    ctx.arc(rayCx, rayCy, 4000, a - spread, a + spread);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.restore();

            // 3. Pilares luminosos distantes
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.beamsFar);
            drawDorficBeams(DORFIC_BEAMS_FAR, now);
            ctx.restore();

            // 4. Chão de meio-tom em perspectiva
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.floor);
            drawDorficFloor(now);
            ctx.restore();

            // 5. Pilares luminosos próximos
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.beamsNear);
            drawDorficBeams(DORFIC_BEAMS_NEAR, now);
            ctx.restore();

            // 6. Partículas / bokeh flutuando
            ctx.save();
            hillsLayerShift(followX, followY, DORFIC_PARALLAX.dust);
            ctx.fillStyle = 'rgba(255,210,140,0.35)';
            for (const p of DORFIC_DUST) {
                const e = dorficPingPong(now + p.delay * 1000, 7000);
                const x = dorficLayerX(p.l);
                const y = dorficLayerY(p.t) - 0.03 * H * e;
                ctx.save();
                ctx.translate(x + p.size / 2, y + p.size / 2);
                ctx.rotate((20 * e) * Math.PI / 180);
                if (p.round) {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                }
                ctx.restore();
            }
            ctx.restore();

            // 7. Vinheta suave (elipse centrada em 50% / 55%, transparente até 55% do raio)
            ctx.save();
            const vRx = 0.7071 * W, vRy = 0.7778 * H;
            ctx.translate(W / 2, 0.55 * H);
            ctx.scale(1, vRy / vRx);
            const vig = ctx.createRadialGradient(0, 0, 0, 0, 0, vRx);
            vig.addColorStop(0, 'rgba(120,20,0,0)');
            vig.addColorStop(0.55, 'rgba(120,20,0,0)');
            vig.addColorStop(1, 'rgba(120,20,0,0.25)');
            ctx.fillStyle = vig;
            const vBig = M * 2;
            ctx.fillRect(-vBig, -vBig, vBig * 2, vBig * 2);
            ctx.restore();
        }

        // Palco do mapa "DORFic": placa laranja com grade, borda clara, brilho e um anel central
        function drawDorficStageFill(stage, extrude) {
            const x = stage.x, y = stage.y, w = stage.width, h = stage.height;

            // Brilho externo (0 0 40px rgba(255,220,120,.8)) + sombra projetada, desenhados uma vez atrás da placa
            ctx.save();
            ctx.shadowColor = 'rgba(255,220,120,0.8)';
            ctx.shadowBlur = 40;
            ctx.fillStyle = '#e8590c';
            ctx.fillRect(x, y, w, h);
            ctx.shadowColor = 'rgba(110,20,0,0.45)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 18;
            ctx.fillRect(x, y, w, h);
            ctx.restore();

            // Topo (mais claro, recebe a luz)
            const topGrad = ctx.createLinearGradient(0, y - extrude, 0, y);
            topGrad.addColorStop(0, '#ffe9a8');
            topGrad.addColorStop(1, '#ffc766');
            ctx.fillStyle = topGrad;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w + extrude, y - extrude);
            ctx.lineTo(x + extrude, y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#ffe9a8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Lateral direita (sombra)
            ctx.fillStyle = '#a63405';
            ctx.beginPath();
            ctx.moveTo(x + w, y);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x + w + extrude, y + h - extrude);
            ctx.lineTo(x + w + extrude, y - extrude);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7a2403';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Face frontal: radial-gradient(ellipse at 50% 40%, #ffb14a 0, #e8590c 70%, #c23f06 100%)
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip(); // o gradiente escalado é maior que a face: recorta para não vazar
            const frx = (w / 2) * Math.SQRT2, fry = (h * 0.6) * Math.SQRT2;
            ctx.translate(x + w / 2, y + h * 0.4);
            ctx.scale(1, fry / frx);
            const face = ctx.createRadialGradient(0, 0, 0, 0, 0, frx);
            face.addColorStop(0, '#ffb14a');
            face.addColorStop(0.7, '#e8590c');
            face.addColorStop(1, '#c23f06');
            ctx.fillStyle = face;
            ctx.fillRect(-frx, -frx, frx * 2, frx * 2); // espaço já escalado: a cor final se estende além do raio
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();

            // Grade branca translúcida: células de 12,5% x 25%
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i <= 8; i++) { const gx = x + (w * i) / 8; ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
