            for (let j = 0; j <= 4; j++) { const gy = y + (h * j) / 4; ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
            ctx.stroke();

            // Brilho interno nas bordas (equivale ao inset 0 0 30px do CSS, reduzido para a face de 40px):
            // quatro gradientes lineares que somem em direção ao centro
            const glowSize = 9;
            const edgeGlow = (x0, y0, x1, y1, rx, ry, rw, rh) => {
                const g = ctx.createLinearGradient(x0, y0, x1, y1);
                g.addColorStop(0, 'rgba(255,240,180,0.5)');
                g.addColorStop(1, 'rgba(255,240,180,0)');
                ctx.fillStyle = g;
                ctx.fillRect(rx, ry, rw, rh);
            };
            edgeGlow(x, y, x, y + glowSize, x, y, w, glowSize);                          // topo
            edgeGlow(x, y + h, x, y + h - glowSize, x, y + h - glowSize, w, glowSize);   // base
            edgeGlow(x, y, x + glowSize, y, x, y, glowSize, h);                          // esquerda
            edgeGlow(x + w, y, x + w - glowSize, y, x + w - glowSize, y, glowSize, h);   // direita
            ctx.restore();

            // Anel central luminoso (versão achatada para caber na face de 40px)
            ctx.save();
            ctx.shadowColor = 'rgba(255,235,150,0.9)';
            ctx.shadowBlur = 12;
            ctx.strokeStyle = 'rgba(255,240,190,0.85)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w * 0.09, h * 0.30, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // Borda clara (inset 3px #ffe9a8)
            ctx.strokeStyle = '#ffe9a8';
            ctx.lineWidth = 3;
            ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
        }

        // Função de desenho (Pronta para receber imagens no futuro)
        function drawPlayer(player, isMoving) {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Espelha o sprite horizontalmente conforme a direção do movimento
            if (player.facingLeft) ctx.scale(-1, 1);

            // Resolve os sprites do personagem escolhido por este jogador (fallback: Renanzinho)
            const charDef = CHARACTERS[player.character] || CHARACTERS.renanzinho;
            const cSprites = charDef.sprites;

            // Escolhe o frame: atacando usa o sprite do golpe, pulando usa r_walk3, senão idle parado ou ciclo de 4 frames a 12fps enquanto anda
            let currentSprite = cSprites.idle;
            let spriteOffsetX = 0;
            if (player.clipperThrowFlashUntil && Date.now() < player.clipperThrowFlashUntil) {
                currentSprite = cSprites.throw;
            } else if (player.bulletShootFlashUntil && Date.now() < player.bulletShootFlashUntil) {
                currentSprite = cSprites.shoot;
            } else if (player.attackName === 'shield') {
                const shieldSprites = cSprites.shield;
                if (shieldSprites && shieldSprites.length) {
                    const frameIndex = Math.floor(Date.now() / SHIELD_FRAME_DURATION) % shieldSprites.length;
                    currentSprite = shieldSprites[frameIndex];
                }
            } else if (player.attackName) {
                spriteOffsetX = 12; // ajuste fino: sprites de ataque encaixam melhor mais à direita
                if (player.attackName === 'kick') {
                    currentSprite = cSprites.kick;
                } else if (player.attackName === 'throwPolish' || player.attackName === 'spitJelly') {
                    currentSprite = cSprites.throw;
                } else if (player.attackName === 'nail') {
                    currentSprite = cSprites.nail;
                    spriteOffsetX = 22; // sprite de unhada é mais largo que o idle; desloca mais pra direita para não parecer que a Aggie "recua"
                } else {
                    const def = (charDef.attacks || ATTACK_DEFS)[player.attackName];
                    currentSprite = def ? cSprites.punch[def.sprite] : cSprites.idle;
                }
            } else if (player.isDoubleJumping) {
                currentSprite = cSprites.djump || cSprites.jump;
            } else if (player.isJumping) {
                currentSprite = cSprites.jump;
            } else if (isMoving) {
                const frameIndex = Math.floor(Date.now() / WALK_FRAME_DURATION) % cSprites.walk.length;
                currentSprite = cSprites.walk[frameIndex];
            }
            if (!currentSprite) currentSprite = cSprites.idle; // fallback: personagem sem esse sprite (ex.: Aggie sem kick)

            // Squash & stretch: estica no ar (subindo/caindo) e achata com uma "mola"
            // elástica ao pousar (passa do normal, volta, e assenta), em vez de um
            // decaimento reto — dá muito mais vida ao impacto.
            // Prioriza "onGround" sobre "isJumping": em jogadores remotos, o campo isJumping
            // pode chegar levemente atrasado/fora de ordem pela rede (mais perceptível em
            // plataformas pequenas, onde ele entra e sai da borda com frequência), o que
            // fazia o sprite alternar entre stretch e squash e parecer "travado/amassado".
            let scaleX = 1, scaleY = 1;
            const vy = player.vy || 0;
            const ATTACK_SQUASH_DURATION = 120; // curto e rápido, só um "puff" no instante do golpe
            if (player.attackSquashTime && (Date.now() - player.attackSquashTime) < ATTACK_SQUASH_DURATION) {
                // Achatamento rápido na direção do golpe: alarga (soco/chute "empurra" a silhueta) e encolhe na vertical
                const t = (Date.now() - player.attackSquashTime) / ATTACK_SQUASH_DURATION;
                const punch = Math.sin(t * Math.PI) * 0.22; // sobe e volta a 0 suavemente
                scaleX = 1 + punch;
                scaleY = 1 - punch * 0.6;
            } else if (!player.onGround && player.isJumping && !player.isDoubleJumping) {
                const stretch = Math.min(Math.abs(vy) / 900, 0.28);
                scaleY = 1 + stretch;
                scaleX = 1 - stretch * 0.55;
            } else if (player.squashTime && (Date.now() - player.squashTime) < SQUASH_DURATION) {
                // Achata forte no instante do pouso e depois faz um pequeno "boing"
                // elástico (overshoot) antes de assentar de vez no tamanho normal.
                const t = (Date.now() - player.squashTime) / SQUASH_DURATION;
                // Easing elástico: oscila com amplitude decrescente em torno de 0
                const decay = Math.pow(1 - t, 2);
                const wobble = Math.sin(t * Math.PI * 2.5);
                const squash = decay * wobble * 0.32;
                scaleY = 1 - squash;
                scaleX = 1 + squash * 0.6;
            }
            ctx.scale(scaleX, scaleY);

            if (currentSprite.complete && currentSprite.naturalWidth > 0) {
                // Mantém a altura de referência do personagem (SPRITE_HEIGHT) e calcula a largura
                // pela proporção NATIVA de cada sprite, para não espremer/esticar personagens
                // cuja imagem tenha proporção diferente da do Renanzinho (86x154).
                let drawH = SPRITE_HEIGHT;
                let drawW = drawH * (currentSprite.naturalWidth / currentSprite.naturalHeight);
                ctx.drawImage(currentSprite, -drawW/2 + spriteOffsetX, -SPRITE_HEIGHT + PLAYER_SIZE/2, drawW, drawH);

                // Flash vermelho translúcido seguindo o CONTORNO REAL do sprite (silhueta),
                // não um retângulo: desenha o sprite num canvas auxiliar, pinta só os pixels
                // opacos de vermelho (source-in) e compõe o resultado por cima do personagem.
                if (player.hitFlashTime && (Date.now() - player.hitFlashTime) < HIT_FLASH_DURATION) {
                    const alpha = 1 - (Date.now() - player.hitFlashTime) / HIT_FLASH_DURATION;

                    const fw = Math.ceil(drawW);
                    const fh = Math.ceil(drawH);
                    if (flashCanvas.width !== fw) flashCanvas.width = fw;
                    if (flashCanvas.height !== fh) flashCanvas.height = fh;
                    flashCtx.clearRect(0, 0, fw, fh);
                    flashCtx.drawImage(currentSprite, 0, 0, fw, fh);
                    flashCtx.globalCompositeOperation = 'source-in';
                    flashCtx.fillStyle = '#ff0000';
                    flashCtx.fillRect(0, 0, fw, fh);
                    flashCtx.globalCompositeOperation = 'source-over';

                    ctx.save();
                    ctx.globalAlpha = alpha * 0.7;
                    ctx.drawImage(flashCanvas, -drawW/2 + spriteOffsetX, -SPRITE_HEIGHT + PLAYER_SIZE/2, drawW, drawH);
                    ctx.restore();
                }
            } else {
                // Placeholder enquanto os sprites não carregam
                ctx.fillStyle = player.color;
                ctx.fillRect(-PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
                if (isMoving) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-PLAYER_SIZE/2, -PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
                }
                if (player.hitFlashTime && (Date.now() - player.hitFlashTime) < HIT_FLASH_DURATION) {
                    const alpha = 1 - (Date.now() - player.hitFlashTime) / HIT_FLASH_DURATION;
                    ctx.fillStyle = `rgba(255,0,0,${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, PLAYER_SIZE/2, PLAYER_SIZE/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.scale(1 / scaleX, 1 / scaleY); // desfaz o squash/stretch antes do texto abaixo
            if (player.facingLeft) ctx.scale(-1, 1); // desfaz o espelhamento para o texto abaixo não inverter

            // Nome do jogador
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(player.name, 0, -SPRITE_HEIGHT + PLAYER_SIZE/2 - 10);

            ctx.restore();
        }

        // ==========================================
        // 4. INTERAÇÃO
        // ==========================================

        // Controle via teclado: seta esq/dir move, seta cima pula, Z soca (combo), X chuta
        const keysPressed = {};
        window.addEventListener('keydown', (e) => {
            if (!myUserId) return;
            if (e.code === 'KeyR' && matchOver) {
                e.preventDefault();
                requestPlayAgain();
                return;
            }
            if (matchOver) return; // partida encerrada: ignora demais controles até dar restart
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
                keysPressed[e.code] = true;
                if (e.code === 'ArrowUp') startJump();
            } else if (e.code === 'KeyZ') {
                e.preventDefault();
                const me = players[myUserId];
                if (me && me.character === 'renanAntigo') {
                    if (keysPressed['ArrowDown']) {
                        activateShield(me);
                    } else {
                        shootBullet(me);
                    }
                } else if (me && me.character === 'aggie') {
                    if (keysPressed['ArrowDown']) {
                        throwClipper(me);
                    } else {
                        throwPolish(me);
                    }
                } else if (me && me.character === 'blui') {
                    startAttack(me, 'punch1');
                } else if (me && !me.onGround) {
                    if (!startDoubleJump()) {
                        startAttack(players[myUserId], 'punch1');
                    }
                } else {
                    startAttack(players[myUserId], 'punch1');
                }
            } else if (e.code === 'KeyX') {
                e.preventDefault();
                const me = players[myUserId];
                if (me && me.character === 'renanAntigo') {
                    // sem ataques por enquanto
                } else if (me && me.character === 'aggie') {
                    startAttack(me, 'nail');
                } else if (me && me.character === 'blui') {
                    spitJelly(me);
                } else {
                    startAttack(players[myUserId], 'kick');
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                keysPressed[e.code] = false;
            }
        });

        // Inicia o pulo do jogador local: aplica um impulso de velocidade vertical (só se estiver no chão)
        function startJump() {
            const me = players[myUserId];
            if (!me || !me.onGround) return;
            me.vy = JUMP_VELOCITY;
            me.onGround = false;
            me.isJumping = true;
            me.doubleJumpUsed = false;
            SFX.playJump(false);
        }

        // Pulo duplo: acionado ao apertar Z (soco) enquanto o jogador está no ar e ainda não usou o pulo duplo.
        // Solta um balde (r_bucket.png) para baixo, girando, sem colisão, como efeito de "impulso".
        function startDoubleJump() {
            const me = players[myUserId];
            if (!me || me.onGround || me.doubleJumpUsed) return false;
            me.vy = JUMP_VELOCITY;
            me.doubleJumpUsed = true;
            me.isDoubleJumping = true;
            SFX.playJump(true);

            fallingBuckets.push({
                x: me.x,
                y: me.y,
                vy: 260,
                rotation: 0,
                rotSpeed: (me.facingLeft ? -1 : 1) * (Math.PI * 2.2),
                life: 0,
                maxLife: 900
            });

            MP.broadcastToAll({ type: 'doubleJump', pid: myUserId, x: me.x, y: me.y, facingLeft: me.facingLeft });

            return true;
        }

        // ==========================================
        // 5. MULTIPLAYER — PeerJS WebRTC (P2P)
        // ==========================================
        const MP = {
            peer: null,
            role: null,       // 'host' ou 'client'
            hostId: null,
            conns: {},         // conexões diretas (host: com todos; client: só com o host)
            roomCode: null,

            _send(conn, data) { try { conn.send(data); } catch (e) {} },

            // Host retransmite para todos os clientes (exceto o remetente original)
            broadcast(data, excludeId) {
                for (const id in this.conns) {
                    if (id !== excludeId) this._send(this.conns[id], data);
                }
            },

            // Envia para todos, independente do papel (host transmite direto; client manda pro host repassar)
            broadcastToAll(data) {
                if (this.role === 'host') {
                    this.broadcast(data);
                } else if (this.conns[this.hostId]) {
                    this._send(this.conns[this.hostId], data);
                }
            },

            sendState() {
                if (!myUserId) return;
                const me = players[myUserId];
                const msg = {
                    type: 'state', pid: myUserId,
                    name: myPlayerState.name, color: myPlayerState.color, character: myPlayerState.character,
                    isJumping: me ? me.isJumping : false, vy: me ? me.vy : 0, squashTime: me ? me.squashTime : 0,
                    isDoubleJumping: me ? me.isDoubleJumping : false,
                    onGround: me ? me.onGround : true,
                    x: me ? me.x : myPlayerState.x,
                    y: me ? me.y : myPlayerState.y,
                    isMoving: me ? !!(keysPressed['ArrowLeft'] || keysPressed['ArrowRight']) : false,
                    facingLeft: me ? me.facingLeft : false,
                    damage: me ? me.damage : 0,
                    lives: me ? (typeof me.lives === 'number' ? me.lives : 3) : 3,
                    eliminated: me ? !!me.eliminated : false,
                    attackName: me ? me.attackName : null,
                    attackStart: me ? me.attackStart : 0,
                    attackUntil: me ? me.attackUntil : 0,
                    attackSquashTime: me ? me.attackSquashTime : 0,
                    clipperThrowFlashUntil: me ? me.clipperThrowFlashUntil : 0,
                    bulletShootFlashUntil: me ? me.bulletShootFlashUntil : 0,
                    hitstunUntil: me ? me.hitstunUntil : 0,
                    isShielding: me ? me.isShielding : false,
                    lastUpdate: Date.now()
                };
                this.broadcastToAll(msg);
            },

            // Processa dados recebidos de qualquer conexão
            onMsg(fromId, data) {
                if (data.type === 'state') {
                    const id = data.pid;
                    if (id === myUserId) return;
                    if (!players[id]) {
                        players[id] = { ...data, renderTargetX: data.x, renderTargetY: data.y };
                    } else {
                        players[id].name = data.name;
                        players[id].color = data.color;
                        players[id].character = data.character;
                        players[id].isJumping = data.isJumping;
                        players[id].isDoubleJumping = data.isDoubleJumping;
                        players[id].onGround = data.onGround;
                        players[id].vy = data.vy;
                        players[id].squashTime = data.squashTime;
                        players[id].isMoving = data.isMoving;
                        players[id].facingLeft = data.facingLeft;
                        players[id].damage = data.damage;
                        players[id].lives = typeof data.lives === 'number' ? data.lives : 3;
                        const wasEliminated = players[id].eliminated;
                        players[id].eliminated = !!data.eliminated;
                        if (!wasEliminated && players[id].eliminated) checkMatchEnd();
                        if (data.attackName === 'nail' && players[id].attackName !== 'nail') {
                            const dir = data.facingLeft ? -1 : 1;
                            spawnClawEffect(data.x + dir * 38, data.y - PLAYER_SIZE * 0.35, dir);
                        }
                        players[id].attackName = data.attackName;
                        players[id].attackStart = data.attackStart;
                        players[id].attackUntil = data.attackUntil;
                        players[id].attackSquashTime = data.attackSquashTime;
                        players[id].clipperThrowFlashUntil = data.clipperThrowFlashUntil;
                        players[id].bulletShootFlashUntil = data.bulletShootFlashUntil;
                        players[id].hitstunUntil = data.hitstunUntil;
                        players[id].isShielding = data.isShielding;
                        // Guarda como alvo para interpolação suave (evita "teleporte" a cada pacote)
                        players[id].renderTargetX = data.x;
                        players[id].renderTargetY = data.y;
                        // Corrige direto se a diferença for muito grande (lag/entrada na sala), ou se a
                        // posição atual estiver inválida (NaN/undefined) por algum motivo — sem isso, o
                        // jogador ficava travado fora de sincronia para sempre, já que Math.hypot com NaN
                        // nunca é maior que 150 e a correção nunca acontecia.
                        const curX = players[id].x, curY = players[id].y;
                        const dist = Math.hypot(curX - data.x, curY - data.y);
                        if (!Number.isFinite(curX) || !Number.isFinite(curY) || !(dist <= 150)) {
                            players[id].x = data.x;
                            players[id].y = data.y;
                        }
                        players[id].lastUpdate = data.lastUpdate;
                    }
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'hit') {
                    applyHit(data.targetId, data.damage, data.knockback, data.dir);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'doubleJump') {
                    fallingBuckets.push({
                        x: data.x,
                        y: data.y,
                        vy: 260,
                        rotation: 0,
                        rotSpeed: (data.facingLeft ? -1 : 1) * (Math.PI * 2.2),
                        life: 0,
                        maxLife: 900
                    });
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'polishThrow') {
                    if (data.bottle.ownerId !== myUserId) nailPolishBottles.push(data.bottle);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'clipperThrow') {
                    if (data.clipper.ownerId !== myUserId) nailClippers.push(data.clipper);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'jellySpit') {
                    for (const b of data.balls) {
                        if (b.ownerId !== myUserId) jellyBalls.push(createJellyBall(b));
                    }
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'bulletShoot') {
                    if (data.bullet.ownerId !== myUserId) bullets.push(data.bullet);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'bulletRemove') {
                    const idx = bullets.findIndex(b => b.id === data.bulletId);
                    if (idx !== -1) bullets.splice(idx, 1);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'leave') {
                    delete players[data.pid];
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'readyState') {
                    _readyState[data.pid] = data.ready;
                    renderReadyList();
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'characterSelect') {
                    _characterMap[data.pid] = data.character;
                    if (players[data.pid]) players[data.pid].character = data.character;
                    renderReadyList();
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'readyCursor') {
                    updateReadyCursor(data.pid, data.x, data.y);
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'gameStart') {
                    runCountdownThenBegin();
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'mapSelect') {
                    currentMapIndex = data.mapIndex;
                    renderMapSelect();
                    if (this.role === 'host') this.broadcast(data, fromId);
                }
                else if (data.type === 'playAgain') {
                    _playAgainState[data.pid] = true;
                    if (this.role === 'host') this.broadcast(data, fromId);
                    updateVictoryStatusPanel();
                    checkPlayAgainAll();
                }
            },

            // Um jogador saiu: avisa os demais e remove localmente
            removePlayer(id) {
                delete players[id];
                delete this.conns[id];
                this.broadcast({ type: 'leave', pid: id });
            }
        };

        setInterval(() => { if (isRunning) MP.sendState(); }, 33);

        // Desconectar graciosamente ao fechar a aba
        window.addEventListener('beforeunload', () => {
            _manualDisconnect = true;
            if (myUserId) MP.broadcastToAll({ type: 'leave', pid: myUserId });
        });

        // Entra na sala e mostra a sala de espera (pronto/aguardando) antes da gameplay
        function startGame() {
            document.getElementById('lobby-overlay').style.display = 'none';
            openReadyScreen();
        }

        // ==========================================
        // 5.5. SALA DE ESPERA (pronto + cursores)
        // ==========================================
        const readyOverlay = document.getElementById('ready-overlay');
        const readyPlayerList = document.getElementById('ready-player-list');
        const readyCursors = document.getElementById('ready-cursors');
        const readyBtn = document.getElementById('ready-btn');
        const readyStartBtn = document.getElementById('ready-start-btn');
        const _readyState = {}; // pid -> true/false
        const _readyCursorEls = {}; // pid -> DOM el
        let amIReady = false;

        // Seleção de personagem: clique num slot jogável escolhe o personagem e avisa os outros
        document.querySelectorAll('#char-select-grid .char-slot.playable').forEach(slotEl => {
            slotEl.addEventListener('click', () => {
                const characterId = slotEl.dataset.character;
                myPlayerState.character = characterId;
                document.querySelectorAll('#char-select-grid .char-slot.playable').forEach(el => el.classList.remove('selected'));
                slotEl.classList.add('selected');
                MP.broadcastToAll({ type: 'characterSelect', pid: myUserId, character: characterId });
            });
        });

        function openReadyScreen() {
            readyOverlay.style.display = 'block';
            readyBtn.style.display = 'inline-block';
            _readyState[myUserId] = false;
            amIReady = false;
            _playAgainState = {};
            readyBtn.textContent = 'Pronto';
            document.querySelectorAll('#char-select-grid .char-slot.playable').forEach(el => {
                el.classList.toggle('selected', el.dataset.character === myPlayerState.character);
            });
            renderReadyList();
            renderMapSelect();
        }

        // Seletor de mapa na tela de pronto: só o host pode escolher; outros veem o mapa
        // atual mas os botões ficam desabilitados. Criado dinamicamente e inserido antes
        // do botão "Pronto" para não depender de alterar o HTML estático.
        let _mapSelectEl = null;
        function renderMapSelect() {
            if (!_mapSelectEl) {
                _mapSelectEl = document.createElement('div');
                _mapSelectEl.id = 'map-select';
                _mapSelectEl.style.cssText = 'margin: 12px 0; text-align:center;';
                readyBtn.parentNode.insertBefore(_mapSelectEl, readyBtn);
            }
            const isHost = MP.role === 'host';
            _mapSelectEl.innerHTML = '<div style="color:#fff; font-size:13px; margin-bottom:6px;">Mapa</div>' +
                MAPS.map((m, i) => `<button type="button" data-mapindex="${i}" class="map-select-btn"
                    style="margin:0 4px; padding:6px 12px; border-radius:6px; border:2px solid ${i === currentMapIndex ? '#ffd400' : '#555'};
                    background:#333; color:#fff; font-weight:bold; cursor:${isHost ? 'pointer' : 'default'}; opacity:${isHost ? '1' : '0.7'};"
                    ${isHost ? '' : 'disabled'}>${m.name}</button>`).join('');
            if (isHost) {
                _mapSelectEl.querySelectorAll('.map-select-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentMapIndex = parseInt(btn.dataset.mapindex, 10);
                        renderMapSelect();
                        MP.broadcastToAll({ type: 'mapSelect', mapIndex: currentMapIndex });
                    });
                });
            }
        }

        function nickFor(pid) {
            if (pid === myUserId) return myPlayerState.name;
            if (_hostNickMap[pid]) return _hostNickMap[pid];
            return (players[pid] && players[pid].name) || pid;
        }

        function renderReadyList() {
            const pids = Object.keys(_readyState);
            const cards = pids.map((pid, i) => {
                const name = nickFor(pid) + (pid === myUserId ? ' (você)' : '');
                const ready = _readyState[pid];
                const charId = (pid === myUserId ? myPlayerState.character : (_characterMap[pid] || (players[pid] && players[pid].character))) || 'renanzinho';
                const iconSrc = (CHARACTERS[charId] || CHARACTERS.renanzinho).sprites.idle.src;
                return `<div class="ready-pcard${ready ? ' is-ready' : ''}">
                    <div class="ready-pcard-check">✓</div>
                    <div class="ready-pcard-tag">P${i + 1}</div>
                    <div class="ready-pcard-stage">
                        <div class="ready-pcard-disk"></div>
                        <img src="${iconSrc}">
                    </div>
                    <div class="ready-pcard-name">${name}</div>
                    <div class="ready-pcard-status">${ready ? 'Pronto' : 'Aguardando'}</div>
                </div>`;
            });
            readyPlayerList.innerHTML = cards.join('');
            const allReady = pids.length >= 2 && pids.every(pid => _readyState[pid]);
            readyStartBtn.style.display = (MP.role === 'host' && allReady) ? 'inline-block' : 'none';
        }

        readyBtn.addEventListener('click', () => {
            amIReady = !amIReady;
            readyBtn.textContent = amIReady ? 'Cancelar' : 'Pronto';
            _readyState[myUserId] = amIReady;
            renderReadyList();
            MP.broadcastToAll({ type: 'readyState', pid: myUserId, ready: amIReady });
        });

        readyStartBtn.addEventListener('click', () => {
            if (Object.keys(_readyState).length < 2) return;
            MP.broadcastToAll({ type: 'gameStart' });
            runCountdownThenBegin();
        });

        // ==========================================
        // CONTADOR REGRESSIVO (3, 2, 1, LUTAR!)
        // Roda em todo mundo ao mesmo tempo, disparado pela msg 'gameStart' (sincronizado
        // de forma "best effort": cada cliente inicia o próprio timer local ao receber a
        // msg, o que é preciso o suficiente já que o gameplay em si já reconcilia estado).
        // ==========================================
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNumberEl = document.getElementById('countdown-number');

        function runCountdownThenBegin() {
            readyOverlay.style.display = 'none';
            const sequence = ['3', '2', '1', 'LUTAR!'];
            countdownOverlay.classList.add('show');
            let i = 0;

            function step() {
                if (i >= sequence.length) {
                    countdownOverlay.classList.remove('show');
                    beginGameplay();
                    return;
                }
                const val = sequence[i];
                countdownNumberEl.textContent = val;
                countdownNumberEl.className = ''; // reseta animação
                void countdownNumberEl.offsetWidth; // força reflow pra reiniciar a animação CSS
                countdownNumberEl.classList.add(val === 'LUTAR!' ? 'fight' : 'pop');
                i++;
                setTimeout(step, 750);
            }
            step();
        }

        // Move o cursor visual correspondente a um jogador dentro da ready-screen
        function updateReadyCursor(pid, x, y) {
            let el = _readyCursorEls[pid];
            if (!el) {
                el = document.createElement('div');
                el.style.cssText = 'position:absolute; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; border-top:14px solid #ffd23f; transform-origin:0 0;';
                const label = document.createElement('div');
                label.style.cssText = 'position:absolute; top:14px; left:10px; font-size:12px; color:#fff; background:#000a; padding:1px 5px; border-radius:4px; white-space:nowrap;';
                label.textContent = nickFor(pid);
                el.appendChild(label);
                readyCursors.appendChild(el);
                _readyCursorEls[pid] = el;
            }
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        }

        readyOverlay.addEventListener('mousemove', (e) => {
            if (readyOverlay.style.display === 'none') return;
            MP.broadcastToAll({ type: 'readyCursor', pid: myUserId, x: e.clientX, y: e.clientY });
        });

        // Inicia de fato o motor do jogo (gameplay)
        function beginGameplay() {
            players[myUserId] = { ...myPlayerState, y: getStageRect().y - PLAYER_SIZE / 2 - 1, x: getStageRect().x + getStageRect().width / 2, vy: 0, knockbackVx: 0, onGround: true, isJumping: false, doubleJumpUsed: false, isDoubleJumping: false, lastUpdate: Date.now() };
            statusText.innerText = "Conectado ao Mundo!";
            connectionDot.className = "status-dot connected";
            readyOverlay.style.display = 'none';
            for (const pid in _readyCursorEls) _readyCursorEls[pid].remove();
            if (!isRunning) {
                isRunning = true;
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        // ==========================================
        // 6. TELA INICIAL — CRIAR SALA / ENTRAR
        // ==========================================
        function genRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = 'RW';
            for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        const MAX_PLAYERS = 4; // limite máximo de jogadores por sala

        const lobbyStatus = document.getElementById('lobby-status');
        let _hostNickMap = {};
        let _characterMap = {}; // pid -> characterId escolhido na tela de espera (separado de players, que só existe na gameplay)

        // Traduz os códigos de erro do PeerJS para mensagens amigáveis em português,
        // já que por padrão eles vêm crus (ex.: "peer-unavailable", "network").
        function friendlyPeerError(err) {
            const type = (err && err.type) || '';
            const map = {
                'peer-unavailable': 'Sala não encontrada. Confira se o código está certo.',
                'network': 'Falha de rede. Verifique sua internet e tente de novo.',
                'disconnected': 'Você foi desconectado do servidor. Tentando reconectar...',
                'server-error': 'O servidor de conexão está indisponível no momento.',
                'socket-error': 'Erro de conexão. Tente novamente em alguns segundos.',
                'socket-closed': 'A conexão foi fechada inesperadamente.',
                'browser-incompatible': 'Seu navegador não suporta este recurso. Tente outro navegador.',
                'unavailable-id': 'Esse código de sala já está em uso. Tente criar novamente.',
                'invalid-id': 'Código de sala inválido.',
                'invalid-key': 'Erro de configuração do serviço de conexão.',
                'ssl-unavailable': 'Erro de conexão segura (SSL).',
                'webrtc': 'Seu navegador ou rede está bloqueando a conexão direta (WebRTC).'
            };
            return map[type] || 'Não foi possível conectar. Tente novamente.';
        }

        function setLobbyStatus(text, kind) {
            lobbyStatus.textContent = text;
            lobbyStatus.classList.remove('status-error', 'status-warn', 'status-ok');
            if (kind) lobbyStatus.classList.add('status-' + kind);
        }

        // Trava/destrava botões de host e join pra evitar cliques duplos (ex.: criar 2 salas,
        // ou disparar 2 tentativas de conexão simultâneas por um clique nervoso do jogador).
        const lobbyHostBtn = document.getElementById('lobby-host-btn');
        const lobbyJoinBtn = document.getElementById('lobby-join-btn');
        function setLobbyBtnBusy(btn, busy, busyLabel, idleLabel) {
            btn.disabled = busy;
            btn.innerHTML = busy ? `<span class="btn-spinner"></span>${busyLabel}` : idleLabel;
        }

        // Reconexão automática: se a conexão P2P cair inesperadamente (não por ação do
        // usuário), tenta reconectar por algumas tentativas antes de desistir de vez.
        const RECONNECT_MAX_ATTEMPTS = 5;
        const RECONNECT_DELAY_MS = 1500;
        let _reconnectAttempts = 0;
        let _reconnectTimer = null;
        let _manualDisconnect = false;

        function attemptReconnect() {
            if (_manualDisconnect) return;
            if (_reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
                statusText.innerText = 'Não foi possível reconectar. Recarregue a página.';
                connectionDot.className = 'status-dot error';
                return;
            }
            _reconnectAttempts++;
            statusText.innerText = `Reconectando... (tentativa ${_reconnectAttempts}/${RECONNECT_MAX_ATTEMPTS})`;
            connectionDot.className = 'status-dot connecting';

            _reconnectTimer = setTimeout(() => {
                if (MP.role !== 'client' || !MP.hostId) return;
                try {
                    const conn = MP.peer.connect(MP.hostId, { reliable: true });
                    MP.conns[MP.hostId] = conn;
                    conn.on('open', () => {
                        _reconnectAttempts = 0;
                        conn.send({ type: 'nick', nick: myPlayerState.name });
                        statusText.innerText = 'Reconectado!';
                        connectionDot.className = 'status-dot connected';
                        attachClientConnHandlers(conn, MP.hostId);
                    });
                    conn.on('error', () => attemptReconnect());
                } catch (e) {
                    attemptReconnect();
                }
            }, RECONNECT_DELAY_MS);
        }

        function updateLobbyPlayerList() {
            const el = document.getElementById('lobby-player-list');
            const items = ['👑 ' + myPlayerState.name + ' (você)'];
            for (const pid in _hostNickMap) {
                if (pid === myUserId) continue;
                items.push('🙂 ' + _hostNickMap[pid]);
            }
            const count = Object.keys(_hostNickMap).length;
            items.push(`<span style="opacity:0.7;">${count}/${MAX_PLAYERS} jogadores</span>`);
            el.innerHTML = items.join('<br>');
            const startBtn = document.getElementById('lobby-start-btn');
            startBtn.disabled = count < 2;
            startBtn.style.opacity = count < 2 ? '0.5' : '1';
            startBtn.style.cursor = count < 2 ? 'not-allowed' : 'pointer';
        }

        // --- HOST ---
        document.getElementById('lobby-host-btn').addEventListener('click', () => {
            if (lobbyHostBtn.disabled) return; // previne double-click
            const nick = document.getElementById('lobby-nick').value.trim();
            if (nick) myPlayerState.name = nick;
            setLobbyBtnBusy(lobbyHostBtn, true, 'Criando sala...', 'Criar Sala');
            setLobbyStatus('Criando sala...', 'warn');

            MP.role = 'host';
            const shortCode = genRoomCode();
            MP.peer = new Peer(shortCode);

            MP.peer.on('open', (id) => {
                myUserId = id;
                MP.hostId = id;
                MP.roomCode = id;
                _hostNickMap = {};
                _hostNickMap[id] = myPlayerState.name;
                document.getElementById('lobby-room-code').textContent = id;
                document.getElementById('lobby-room-display').style.display = 'block';
                setLobbyStatus('Sala criada! Compartilhe o código.', 'ok');
                setLobbyBtnBusy(lobbyHostBtn, false, '', 'Criar Sala');
                updateLobbyPlayerList();
            });

            MP.peer.on('connection', (conn) => {
                // Sala cheia: recusa a conexão e avisa o cliente, sem adicioná-lo aos jogadores
                const currentCount = Object.keys(_hostNickMap).length;
                if (currentCount >= MAX_PLAYERS) {
                    conn.on('open', () => {
                        conn.send({ type: 'roomFull' });
                        setTimeout(() => conn.close(), 200); // pequeno delay p/ garantir que a msg chegue antes de fechar
                    });
                    return;
                }

                MP.conns[conn.peer] = conn;
                conn.on('open', () => {
                    // Manda para o novo cliente o estado de todos os jogadores já na sala e da caixa de arma
                    conn.send({ type: 'welcome', players: players, nickMap: _hostNickMap });
                });
                conn.on('data', (data) => {
                    if (data.type === 'nick') {
                        _hostNickMap[conn.peer] = data.nick;
                        _readyState[conn.peer] = false;
                        updateLobbyPlayerList();
                        renderReadyList();
                        MP.broadcast({ type: 'nickUpdate', pid: conn.peer, nick: data.nick });
                    } else {
                        MP.onMsg(conn.peer, data);
                    }
                });
                conn.on('close', () => {
                    MP.removePlayer(conn.peer);
                });
                conn.on('error', () => {});
            });

            MP.peer.on('error', (err) => {
                setLobbyStatus(friendlyPeerError(err), 'error');
                setLobbyBtnBusy(lobbyHostBtn, false, '', 'Criar Sala');
            });
        });

        document.getElementById('lobby-start-btn').addEventListener('click', () => {
            if (Object.keys(_hostNickMap).length < 2) return;
            startGame();
        });

        // Handlers de dados/close/error da conexão do cliente com o host — isolados numa função
        // pra poderem ser reaplicados quando a reconexão automática cria uma conexão nova.
        function attachClientConnHandlers(conn, code) {
            conn.on('data', (data) => {
                if (data.type === 'welcome') {
                    for (const pid in data.players) {
                        if (pid !== myUserId) players[pid] = { ...data.players[pid] };
                    }
                    _hostNickMap = data.nickMap || {};
                    for (const pid in _hostNickMap) _readyState[pid] = false;
                    startGame();
                } else if (data.type === 'roomFull') {
                    setLobbyStatus(`Sala cheia! Máximo de ${MAX_PLAYERS} jogadores.`, 'error');
                } else if (data.type === 'nickUpdate') {
                    if (players[data.pid]) players[data.pid].name = data.nick;
                } else {
                    MP.onMsg(code, data);
                }
            });

            conn.on('close', () => {
                if (_manualDisconnect) return;
                if (!isRunning) {
                    // Ainda no lobby/ready: não há sentido em reconectar automaticamente
                    setLobbyStatus('Conexão com a sala perdida.', 'error');
                    return;
                }
                // Já em jogo: tenta reconectar sozinho antes de exibir erro definitivo
                statusText.innerText = 'Conexão perdida. Reconectando...';
                connectionDot.className = 'status-dot error';
                _reconnectAttempts = 0;
                attemptReconnect();
            });
            conn.on('error', () => {});
        }

        // --- CLIENTE (JOIN) ---
        function joinRoom(code) {
            setLobbyStatus('Conectando...', 'warn');
            MP.role = 'client';
            MP.peer = new Peer();

            MP.peer.on('open', (myId) => {
                myUserId = myId;
                MP.hostId = code;
                const conn = MP.peer.connect(code, { reliable: true });
                MP.conns[code] = conn;

                conn.on('open', () => {
                    conn.send({ type: 'nick', nick: myPlayerState.name });
                    setLobbyStatus('Conectado! Entrando no jogo...', 'ok');
                });

                attachClientConnHandlers(conn, code);
            });

            MP.peer.on('error', (err) => {
                setLobbyStatus(friendlyPeerError(err), 'error');
                setLobbyBtnBusy(lobbyJoinBtn, false, '', 'Entrar na Sala');
            });
        }

        document.getElementById('lobby-join-btn').addEventListener('click', () => {
            if (lobbyJoinBtn.disabled) return; // previne double-click
            const nick = document.getElementById('lobby-nick').value.trim();
            if (nick) myPlayerState.name = nick;
            const code = document.getElementById('lobby-join-code').value.trim().toUpperCase();
            if (!code) { setLobbyStatus('Digite o código da sala.', 'warn'); return; }
            setLobbyBtnBusy(lobbyJoinBtn, true, 'Conectando...', 'Entrar na Sala');
            joinRoom(code);
        });

        // --- TABS DA TELA INICIAL ---
        document.getElementById('lobby-tab-host').addEventListener('click', () => {
            document.getElementById('lobby-tab-host').classList.add('active');
            document.getElementById('lobby-tab-join').classList.remove('active');
            document.getElementById('lobby-host-section').classList.add('open');
            document.getElementById('lobby-join-section').classList.remove('open');
        });
        document.getElementById('lobby-tab-join').addEventListener('click', () => {
            document.getElementById('lobby-tab-join').classList.add('active');
            document.getElementById('lobby-tab-host').classList.remove('active');
            document.getElementById('lobby-join-section').classList.add('open');
            document.getElementById('lobby-host-section').classList.remove('open');
        });

    </script>
</body>
</html>
